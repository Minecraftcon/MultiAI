# MultiAI Configuration File (config.ini)

[General]
DefaultStartupLLM = gemini-2.5-flash
DefaultImageProvider = logflare
DefaultImageModel = sdxl-lightning
DefaultImageAspectRatio = 1:1
RecordDate = true
RecordChatHistory = true
MaxChatHistory = 100
StorageDir = ~/.MultiAI
Port = 8080
Host = 0.0.0.0
LogLevel = info
LogFile = ./logs.txt
SystemPreset = creative

[Agent]
MaxToolRounds = 0
MaxToolsPerRound = 10
AutoScroll = true
StreamReasoning = true
TurnTimeoutSeconds = 120
Temperature = 0.35

[Tools]
EnableTerminal = true
EnableWebSearch = true
EnableImageGeneration = true
EnableFileOperations = true
DefaultTaskCooldown = 2
MaxFileSizeKB = 1024

[Search]
MaxSearchResults = 5
SearchTimeoutSeconds = 15

[UI]
Theme = dark
AuroraTheme = clouds
ShowLineNumbers = true
CompactMobileView = true
