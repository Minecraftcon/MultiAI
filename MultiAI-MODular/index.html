<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0f0f0f">
    <title>MultiSearch AI</title>

    <!-- Native PWA flags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Puter -->
    <script src="https://js.puter.com/v2/"></script>

    <!-- UI Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- HTML sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <!-- Syntax highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
        if (typeof lucide === "undefined") {
            document.write('<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"><\/script>');
        }
    </script>

    <!-- Mermaid Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

    <!-- Modular Stylesheets -->
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/panel.css">
    <link rel="stylesheet" href="./styles/chat.css">
    <link rel="stylesheet" href="./styles/activity.css">
    <link rel="stylesheet" href="./styles/command.css">
    <link rel="stylesheet" href="./styles/code.css">
    <link rel="stylesheet" href="./styles/composer.css">
    <link rel="stylesheet" href="./styles/context-menu.css">
    <link rel="stylesheet" href="./styles/responsive.css">
</head>
<body>

<div id="backdrop"></div>

<!-- ================= SIDE PANEL ================= -->
<aside id="sidePanel" aria-hidden="true">
    <!-- Panel Header: MultiAI Title & Collapse Button (No glowing badge as requested) -->
    <div class="panel-header">
        <div class="panel-brand">
            <span class="panel-brand-title">MultiAI</span>
        </div>
        <button id="panelClose" class="icon-btn panel-close-btn" type="button" aria-label="Close panel" title="Close panel">
            <i data-lucide="panel-left-close"></i>
        </button>
    </div>

    <!-- Quick Navigation Actions -->
    <div class="panel-nav">
        <button id="newChat" class="panel-nav-btn" type="button" title="Start a new chat">
            <i data-lucide="square-pen"></i>
            <span>New Chat</span>
        </button>
        <button id="newVoiceBtn" class="panel-nav-btn" type="button" title="Start voice conversation">
            <i data-lucide="audio-lines"></i>
            <span>New Voice Chat</span>
        </button>
        <button id="newImageBtn" class="panel-nav-btn" type="button" title="Generate an image">
            <i data-lucide="image"></i>
            <span>New Image</span>
        </button>
    </div>

    <!-- Chats Section -->
    <div class="panel-body">
        <div class="panel-section-header">
            <span class="panel-section-label">Chats</span>
            <div class="panel-section-actions">
                <button id="panelSearchToggle" class="panel-sub-btn" type="button" title="Search chats" aria-label="Search chats">
                    <i data-lucide="search"></i>
                </button>
            </div>
        </div>

        <!-- Search Bar (Togglable / Filter) -->
        <div id="panelSearchRow" class="panel-search-row" style="display: none;">
            <div class="panel-search-wrapper">
                <i data-lucide="search" class="search-input-icon"></i>
                <input type="text" id="panelSearchInput" placeholder="Filter chats..." autocomplete="off">
                <button type="button" id="panelSearchClear" class="panel-search-clear" aria-label="Clear search">
                    <i data-lucide="x"></i>
                </button>
            </div>
        </div>

        <div id="chatList" class="chat-list">
            <div class="history-empty">No conversations yet</div>
        </div>
    </div>

    <!-- Footer: Settings & Branding -->
    <div class="panel-footer">
        <button id="panelSettingsBtn" class="panel-footer-btn" type="button" aria-label="Settings and more">
            <div class="panel-footer-left">
                <i data-lucide="settings"></i>
                <span>Settings & More</span>
            </div>
            <div class="panel-footer-badge">
                <span>Free</span>
                <i data-lucide="check"></i>
            </div>
        </button>
        <div class="panel-footer-sub">
            <span>MultiAI Modular</span>
            <span class="panel-footer-dot">•</span>
            <span class="panel-footer-version">v2.0</span>
        </div>
    </div>
</aside>

<!-- ================= SLIDING APP SHELL ================= -->
<div id="appShell">
    <header>
        <div class="header-left">
            <button id="panelToggle" class="icon-btn" type="button" aria-label="Open panel" aria-expanded="false" title="Open panel">
                <i data-lucide="panel-left"></i>
            </button>
        </div>

        <select id="modelSelect" title="Select AI Model">
            <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (Fast & Capable)</option>
            <option value="dots-studio/dots-3-note-preview:free">dots-3-note-preview (Free)</option>
        </select>
    </header>

    <main id="chat"></main>

    <div id="inputArea"></div>
</div>

<!-- ================= ATTACHMENT BOTTOM SHEET DRAWER ================= -->
<div id="attachBackdrop" class="attach-backdrop" style="display: none;"></div>
<div id="attachSheet" class="attach-sheet" aria-hidden="true">
    <div class="sheet-handle-bar">
        <div class="sheet-drag-handle"></div>
    </div>
    <div class="sheet-header">
        <span>Add to conversation</span>
        <button id="attachSheetClose" type="button" class="icon-btn" aria-label="Close sheet">
            <i data-lucide="x"></i>
        </button>
    </div>
    <div class="sheet-actions-grid">
        <button id="pickImageBtn" type="button" class="sheet-action-card">
            <div class="sheet-action-icon image-icon-bg">
                <i data-lucide="image"></i>
            </div>
            <div class="sheet-action-text">
                <span class="sheet-action-title">Image</span>
                <span class="sheet-action-desc">Upload photos & screenshots</span>
            </div>
        </button>
        <button id="pickDocBtn" type="button" class="sheet-action-card">
            <div class="sheet-action-icon doc-icon-bg">
                <i data-lucide="file-text"></i>
            </div>
            <div class="sheet-action-text">
                <span class="sheet-action-title">Documents</span>
                <span class="sheet-action-desc">PDF, TXT, code & data</span>
            </div>
        </button>
    </div>
    <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
    <input type="file" id="docInput" accept=".pdf,.txt,.md,.json,.csv,.py,.js,.html,.css,.yaml,.yml,.xml,.sh,.ts,.jsx,.tsx,.sql,.c,.cpp,.h,.doc,.docx" multiple style="display: none;">
</div>

<!-- ================= RIGHT CLICK CONTEXT MENU (MESSAGE / IN-CHAT) ================= -->
<div id="msgContextMenu" class="context-menu" style="display: none;">
    <button type="button" class="context-menu-item" id="ctxCopyBtn">
        <i data-lucide="copy"></i>
        <span>Copy</span>
    </button>
    <button type="button" class="context-menu-item" id="ctxRegenerateBtn">
        <i data-lucide="rotate-cw"></i>
        <span>Regenerate</span>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item" id="ctxBranchBtn">
        <i data-lucide="git-branch"></i>
        <span>Branch from here</span>
    </button>
    <button type="button" class="context-menu-item" id="ctxExportBtn">
        <i data-lucide="download"></i>
        <span>Export chat</span>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item danger" id="ctxDeleteBtn">
        <i data-lucide="trash-2"></i>
        <span>Delete</span>
    </button>
</div>

<!-- ================= RIGHT CLICK CONTEXT MENU (SIDEBAR CHAT ITEM) ================= -->
<div id="chatItemContextMenu" class="context-menu" style="display: none;">
    <button type="button" class="context-menu-item" id="chatCtxBranchBtn">
        <i data-lucide="git-branch"></i>
        <span>Branch</span>
    </button>
    <button type="button" class="context-menu-item" id="chatCtxExportBtn">
        <i data-lucide="download"></i>
        <span>Export</span>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item danger" id="chatCtxDeleteBtn">
        <i data-lucide="trash-2"></i>
        <span>Delete</span>
    </button>
</div>

<!-- ================= MOBILE MESSAGE ACTIONS (COPY & RETRY) ================= -->
<div id="mobileMsgActions" class="mobile-msg-actions" style="display: none;">
    <button type="button" class="mobile-action-btn" id="mobileCopyBtn" title="Copy" aria-label="Copy">
        <i data-lucide="copy"></i>
    </button>
    <button type="button" class="mobile-action-btn" id="mobileRetryBtn" title="Regenerate" aria-label="Regenerate">
        <i data-lucide="rotate-cw"></i>
    </button>
</div>

<!-- ================= ERROR RECOVERY POPUP (SLIDE FROM RIGHT ON FAILED REQUEST) ================= -->
<div id="errorRecoveryPopup" class="error-recovery-popup" aria-live="polite">
    <div class="recovery-popup-header">
        <div class="recovery-popup-title-group">
            <i data-lucide="alert-circle" class="recovery-alert-icon"></i>
            <span class="recovery-popup-title">Request could not be succeeded</span>
        </div>
        <button id="errorRecoveryClose" type="button" class="recovery-close-btn" aria-label="Dismiss notification">
            <i data-lucide="x"></i>
        </button>
    </div>
    <div id="errorRecoveryMsg" class="recovery-popup-body">
        Continue from here with another model?
    </div>
    <div class="recovery-popup-actions">
        <button id="errorRecoveryCancel" type="button" class="recovery-btn recovery-btn-cancel">
            Cancel
        </button>
        <button id="errorRecoveryContinue" type="button" class="recovery-btn recovery-btn-continue">
            Continue
        </button>
    </div>
</div>
<!-- ================= CHAT ITEM CONTEXT MENU (POPUP FOR ...) ================= -->
<div id="chatItemMenu" class="context-menu chat-item-popover" style="display: none;">
    <button type="button" class="context-menu-item" id="chatRenameBtn">
        <i data-lucide="pencil"></i>
        <span>Rename</span>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item danger" id="chatDeleteBtn">
        <i data-lucide="trash-2"></i>
        <span>Delete</span>
    </button>
</div>

<!-- ================= SETTINGS MODAL ================= -->
<div id="settingsBackdrop" class="settings-backdrop" style="display: none;"></div>
<div id="settingsModal" class="settings-modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-modal-header">
        <div class="settings-modal-title-group">
            <i data-lucide="sliders-horizontal"></i>
            <span id="settingsTitle">Settings</span>
        </div>
        <button id="settingsCloseBtn" type="button" class="icon-btn" aria-label="Close settings">
            <i data-lucide="x"></i>
        </button>
    </div>
    <div class="settings-modal-body">
        <div class="settings-group">
            <label for="cfgStartupLLM" class="settings-label">Default Startup Model</label>
            <select id="cfgStartupLLM" class="settings-select"></select>
        </div>

        <div class="settings-group">
            <label for="cfgImageProvider" class="settings-label">Default Image Provider</label>
            <select id="cfgImageProvider" class="settings-select">
                <option value="pollinations">Pollinations.AI (Free, No Key)</option>
                <option value="openai_image">OpenAI DALL-E (API Key)</option>
            </select>
        </div>

        <div class="settings-group">
            <label for="cfgImageRatio" class="settings-label">Default Image Aspect Ratio</label>
            <select id="cfgImageRatio" class="settings-select">
                <option value="1:1">1:1 Square</option>
                <option value="16:9">16:9 Landscape</option>
                <option value="9:16">9:16 Portrait</option>
                <option value="4:3">4:3 Standard</option>
                <option value="3:2">3:2 Classic</option>
            </select>
        </div>

        <div class="settings-group">
            <label for="cfgTheme" class="settings-label">Appearance Theme</label>
            <select id="cfgTheme" class="settings-select">
                <option value="dark">Dark (Obsidian)</option>
                <option value="light">Light</option>
                <option value="system">System Default</option>
            </select>
        </div>

        <div class="settings-toggle-group">
            <label class="settings-toggle-label">
                <input type="checkbox" id="cfgRecordHistory" checked>
                <span>Record Chat History</span>
            </label>
            <label class="settings-toggle-label">
                <input type="checkbox" id="cfgRecordDate" checked>
                <span>Record Timestamps & Dates</span>
            </label>
        </div>
    </div>
    <div class="settings-modal-footer">
        <button type="button" id="settingsCancelBtn" class="settings-btn settings-btn-cancel">Cancel</button>
        <button type="button" id="settingsSaveBtn" class="settings-btn settings-btn-save">Save Changes</button>
    </div>
</div>

<!-- Isolated Icon Initializer (Protects against any downstream script failures) -->
<script>
    (function() {
        function renderEarly() {
            if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
                try { lucide.createIcons(); } catch(e) {}
            }
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", renderEarly);
        } else {
            renderEarly();
        }
    })();
</script>
<script type="module" src="./src/utils/icons.js"></script>

<!-- Modular Application Entry Point -->
<script type="module" src="./src/main.js"></script>
</body>
</html>
