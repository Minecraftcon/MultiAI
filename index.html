<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MultiSearch AI</title>

    <!-- Native PWA flags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Puter -->
    <script src="https://js.puter.com/v2/"></script>

    <!-- UI Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- HTML sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <!-- Syntax highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Mermaid Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

<style>
/* =========================================================
   GLOBAL & ANIMATIONS
   ========================================================= */
* {
    box-sizing: border-box;
}

:root {
    --panel-width: min(82vw, 300px);
    --panel-ease: cubic-bezier(0.2, 0.9, 0.3, 1);
    --panel-speed: 0.32s;
    --bubble-bg: #303030;
}

html, body {
    margin: 0;
    width: 100vw;
    height: 100dvh;
    min-height: 100dvh;
    background: #0f0f0f;
    overscroll-behavior-x: none;
    overscroll-behavior: none;
    overflow: hidden;
    touch-action: pan-y;
}

body {
    color: #eeeeee;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: -0.01em;
}

@keyframes popIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* =========================================================
   APP SHELL
   ========================================================= */
#appShell {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    transform: translateX(0px);
    will-change: transform;
    background: #0f0f0f;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    perspective: 1000px;
    -webkit-perspective: 1000px;
}

#appShell.animate-transition {
    transition: transform var(--panel-speed) var(--panel-ease);
}

/* =========================================================
   HEADER & MODEL SELECTOR
   ========================================================= */
header {
    height: calc(58px + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid #292929;
    font-size: 17px;
    font-weight: 700;
    background: #0f0f0f;
    z-index: 10;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.header-left > span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.icon-btn {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 9px;
    color: #bbb;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.icon-btn:hover {
    background: #222;
    color: #fff;
    border-color: #333;
}

.icon-btn:active {
    background: #2a2a2a;
}

.icon-btn svg {
    width: 18px;
    height: 18px;
}

#modelSelect {
    background: #1b1b1b;
    color: #e5e5e5;
    border: 1px solid #383838;
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13.5px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
}

#modelSelect:hover {
    border-color: #555;
    background: #222;
}

#modelSelect:focus {
    border-color: #777;
}

#modelSelect option {
    background: #181818;
    color: #eee;
}

/* =========================================================
   SLIDE-IN SIDE PANEL & CHAT ITEMS
   ========================================================= */
#sidePanel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: var(--panel-width);
    height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    z-index: 40;
    display: flex;
    flex-direction: column;
    background: #161616;
    border-right: 1px solid #292929;
    transform: translateX(-100%);
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    perspective: 1000px;
    -webkit-perspective: 1000px;
}

#sidePanel.animate-transition {
    transition: transform var(--panel-speed) var(--panel-ease);
}

.panel-header {
    height: 58px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 18px;
    border-bottom: 1px solid #292929;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
}

.panel-top-actions {
    padding: 12px 14px 4px;
    flex-shrink: 0;
}

.panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
}

.panel-body::-webkit-scrollbar { width: 5px; }
.panel-body::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

.panel-action {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #202020;
    border: 1px solid #333;
    border-radius: 10px;
    color: #eee;
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
}

.panel-action:hover {
    background: #2a2a2a;
    border-color: #454545;
}

.panel-action svg {
    width: 16px;
    height: 16px;
}

.panel-section-title {
    margin: 16px 0 8px;
    padding: 0 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #777;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.count-badge {
    display: inline-block;
    padding: 1px 6px;
    background: #242424;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    color: #888;
}

.chat-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.chat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    user-select: none;
    border: 1px solid transparent;
}

.chat-item:hover {
    background: #1f1f1f;
    border-color: #2b2b2b;
}

.chat-item.active {
    background: #262626;
    border-color: #383838;
}

.chat-item-main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
}

.chat-item-title {
    font-size: 13px;
    color: #bbb;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.35;
}

.chat-item.active .chat-item-title {
    color: #ffffff;
    font-weight: 500;
}

.chat-item-time {
    font-size: 10.5px;
    color: #666;
    line-height: 1.2;
    margin-top: 2px;
}

.chat-item-spinner {
    width: 14px;
    height: 14px;
    border: 2px solid #555;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
}

.chat-item-del {
    display: none;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: #666;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: color 0.15s, background 0.15s;
}

.chat-item:hover .chat-item-del {
    display: flex;
}

.chat-item-del:hover {
    background: #333;
    color: #fff;
}

.chat-item-del svg {
    width: 12px;
    height: 12px;
}

.history-empty {
    padding: 24px 6px;
    color: #555;
    font-size: 12px;
    text-align: center;
}

#backdrop {
    position: fixed;
    inset: 0;
    z-index: 35;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0;
    pointer-events: none !important;
    will-change: opacity;
}

#backdrop.animate-transition {
    transition: opacity var(--panel-speed) var(--panel-ease);
}

/* =========================================================
   CHAT
   ========================================================= */
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px max(20px, calc((100% - 900px) / 2));
    padding-bottom: 120px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
}

#chat::-webkit-scrollbar { width: 7px; }
#chat::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

/* =========================================================
   MESSAGE BASE
   ========================================================= */
.message {
    line-height: 1.6;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    animation: popIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

.user {
    align-self: flex-end;
    max-width: 80%;
    padding: 11px 16px;
    background: var(--bubble-bg);
    border-radius: 18px;
    white-space: pre-wrap;
}

.ai {
    align-self: stretch;
    width: 100%;
    padding: 4px 0;
    background: transparent;
    font-size: 15.5px;
}

/* =========================================================
   SMOOTH "WORKED FOR" / REASONING ACCORDION
   ========================================================= */
.activity-wrapper {
    display: none;
    margin-bottom: 14px;
}

.activity-toggle {
    cursor: pointer;
    color: #999;
    font-size: 13.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    background: transparent;
    border: none;
    padding: 4px 0;
    font-family: inherit;
    transition: color 0.2s ease;
}

.activity-toggle:hover {
    color: #ddd;
}

.activity-toggle .chevron {
    font-size: 10px;
    width: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.activity-wrapper.open .activity-toggle .chevron {
    transform: rotate(90deg);
}

.activity-collapse {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.activity-wrapper.open .activity-collapse {
    grid-template-rows: 1fr;
}

.activity-overflow {
    overflow: hidden;
}

.activity-content {
    margin: 8px 0 4px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.search-items-container {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.search-items-container::before {
    content: "";
    position: absolute;
    left: 17px;
    top: 18px;
    bottom: 18px;
    width: 2px;
    background: #383838;
}

.search-items-container:empty::before {
    opacity: 0;
}

.search-badge-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13.5px;
    line-height: 1.4;
    animation: popIn 0.4s ease;
    position: relative;
    z-index: 1;
}

.search-icon-circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #242424;
    border: 1px solid #383838;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #888;
    position: relative;
}

.search-icon-circle.has-timer-ring {
    border-color: transparent;
    color: #ffffff;
}

.search-icon-circle i svg,
.search-icon-circle > svg:not(.timer-ring-svg) {
    width: 17px;
    height: 17px;
    display: block;
    position: relative;
    z-index: 2;
}

.timer-ring-svg {
    position: absolute;
    inset: -1px;
    width: 36px !important;
    height: 36px !important;
    pointer-events: none;
    z-index: 1;
}

.timer-ring-bg {
    fill: none;
    stroke: #383838;
    stroke-width: 1.5;
}

.timer-ring-bar {
    fill: none;
    stroke: #ffffff;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-dasharray: 108.39;
    stroke-dashoffset: 108.39;
}

.timer-badge.timer-finished .timer-ring-bar {
    stroke-dashoffset: 0;
    stroke: #ffffff;
}

.search-label {
    color: #777;
    margin-right: 4px;
}

.search-query {
    color: #ddd;
    font-weight: 500;
}

/* =========================================================
   STREAMING & CURSOR
   ========================================================= */
.pre-search-content, .final-content {
    display: block;
}

.pre-search-content:empty {
    display: none;
}

.blinking-cursor {
    display: inline-block;
    width: 7px;
    height: 16px;
    background-color: #ddd;
    vertical-align: middle;
    margin-left: 4px;
    animation: blink 1s step-end infinite;
}

/* =========================================================
   MINIMAL CODE BLOCKS & PREVIEW PILL
   ========================================================= */
.ai :not(pre) > code {
    background: var(--bubble-bg);
    border: 1px solid #3c3c3c;
    padding: 2px 7px;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.9em;
    color: #ececec;
}

.code-container {
    margin: 16px 0;
}

.code-lang-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
    padding-left: 2px;
}

.code-lang-label {
    font-size: 12px;
    font-weight: 600;
    color: #888;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    font-family: ui-monospace, monospace;
}

.code-lang-line {
    flex: 1;
    height: 1px;
    background: #242424;
}

.code-mode-pill {
    display: inline-flex;
    align-items: center;
    background: #1e1e1e;
    border: 1px solid #383838;
    border-radius: 20px;
    padding: 2px;
    gap: 2px;
}

.pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: transparent;
    border: none;
    border-radius: 14px;
    color: #888;
    font-size: 11.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
}

.pill-btn:hover { color: #ccc; }
.pill-btn.active { background: #333; color: #fff; }
.pill-btn svg { width: 12px; height: 12px; }

.code-bubble {
    background: var(--bubble-bg);
    border: 1px solid #3c3c3c;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
}

.code-bubble-inner {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    width: 100%;
}

.code-bubble.single-line .code-bubble-inner {
    align-items: center;
}

.code-bubble pre {
    margin: 0;
    padding: 10px 14px;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.5;
    flex: 1;
    min-width: 0;
    background: transparent !important;
}

.code-bubble pre code {
    background: transparent !important;
    padding: 0 !important;
    border: none !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

.code-bubble pre::-webkit-scrollbar { height: 4px; }
.code-bubble pre::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 10px; }

.code-preview-frame {
    display: none;
    width: 100%;
    min-height: 220px;
    border: none;
    background: #ffffff;
}

.code-bubble.view-preview pre { display: none; }
.code-bubble.view-preview .code-preview-frame { display: block; }

.mermaid-diagram-wrapper {
    display: none;
    width: 100%;
    min-height: 100px;
    padding: 16px 14px;
    overflow-x: auto;
    overflow-y: hidden;
    text-align: center;
    background: #181818;
}

.mermaid-diagram-wrapper::-webkit-scrollbar { height: 5px; }
.mermaid-diagram-wrapper::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 10px; }

.mermaid-target {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.mermaid-target svg {
    max-width: 100% !important;
    height: auto !important;
    margin: 0 auto;
}

.code-bubble.view-diagram .mermaid-diagram-wrapper { display: block; }
.code-bubble.view-diagram .mermaid-code-pre { display: none; }
.code-bubble:not(.view-diagram) .mermaid-diagram-wrapper { display: none; }
.code-bubble:not(.view-diagram) .mermaid-code-pre { display: block; }

.mermaid-loading {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #888;
    font-size: 12px;
    padding: 16px;
}

.mermaid-error {
    color: #f87171;
    font-size: 12px;
    padding: 14px;
    text-align: left;
    font-family: inherit;
    line-height: 1.4;
    background: rgba(239, 68, 68, 0.08);
    border-radius: 6px;
}

.code-copy-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    margin: 6px 8px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: #999;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.code-bubble:not(.single-line) .code-copy-btn { align-self: flex-start; }
.code-copy-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; border-color: #484848; }
.code-copy-btn:active { background: rgba(255, 255, 255, 0.15); }
.code-copy-btn svg { width: 15px; height: 15px; }

/* =========================================================
   MARKDOWN TYPOGRAPHY
   ========================================================= */
.ai p { margin: 0 0 16px; }
.ai p:last-child { margin-bottom: 0; }
.ai h1, .ai h2, .ai h3, .ai h4, .ai h5, .ai h6 { line-height: 1.3; font-weight: 700; }
.ai h1 { font-size: 1.8em; margin: 28px 0 14px; }
.ai h2 { font-size: 1.5em; margin: 26px 0 12px; }
.ai h3 { font-size: 1.25em; margin: 22px 0 10px; }
.ai h4 { font-size: 1.1em; margin: 20px 0 8px; }
.ai a { color: #8ab4f8; text-decoration: none; }
.ai a:hover { text-decoration: underline; }
.ai ul, .ai ol { margin: 8px 0 18px; padding-left: 28px; }
.ai li { margin: 5px 0; padding-left: 3px; }

/* =========================================================
   TABLES & MISC
   ========================================================= */
.ai blockquote { margin: 16px 0; padding: 4px 0 4px 16px; border-left: 3px solid #555; color: #bdbdbd; }

.table-wrapper {
    width: 100%;
    max-width: 100%;
    overflow-x: auto !important;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y !important;
    margin: 18px 0;
    border-radius: 8px;
    display: block;
}

.table-wrapper::-webkit-scrollbar { height: 6px; }
.table-wrapper::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 10px; }

.ai table {
    width: max-content !important;
    min-width: 100%;
    border-collapse: collapse;
    border: 1px solid #333;
    font-size: 14px;
    margin: 0;
    touch-action: pan-x pan-y !important;
}

.ai th, .ai td {
    padding: 9px 12px;
    border: 1px solid #333;
    text-align: left;
    white-space: nowrap;
}

.ai th { background: #202020; font-weight: 700; }
.ai tr:nth-child(even) { background: #151515; }
.ai hr { border: 0; border-top: 1px solid #333; margin: 26px 0; }
.ai img { max-width: 100%; border-radius: 10px; margin: 10px 0; }
.ai .katex-display { overflow-x: auto; padding: 8px 4px; margin: 18px 0; }

/* =========================================================
   INPUT AREA
   ========================================================= */
#inputArea {
    position: absolute;
    bottom: 0; 
    left: 0; 
    right: 0;
    display: flex;
    justify-content: center;
    padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;

   MOBILE
   ========================================================= */
@media (max-width: 600px) {

/* =========================================================
   RIGHT-CLICK CONTEXT MENU (MINIMAL POPUP)
   ========================================================= */
.context-menu {
    position: fixed;
    z-index: 1000;
    background: #181818;
    border: 1px solid #333333;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4);

.context-menu-item {

/* =========================================================
   MOBILE MESSAGE ACTIONS (POPUP UNDER MESSAGE)

.mobile-msg-actions {

    background: #181818;

    align-items: center;

}

@keyframes mobileActionsIn {
    from { opacity: 0; transform: translateY(-3px) scale(0.96); }

}

.mobile-action-btn {

    -webkit-tap-highlight-color: transparent;
}

.mobile-action-btn:active {

    color: #ffffff;
}

.mobile-action-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

.mobile-action-btn svg {
    width: 15px;
    height: 15px;
    stroke-width: 2.2;
    transition: transform 0.15s ease;
}

    transform: scale(0.92);
}

@media (min-width: 769px) and (pointer: fine) {
    .mobile-msg-actions {
        display: none !important;
    }
}
</style>
</head>
<body>

<div id="backdrop"></div>

<!-- ================= SIDE PANEL ================= -->

<!-- ================= SLIDING APP SHELL ================= -->
<div id="appShell">
    <header>

        <select id="modelSelect" title="Select AI Model">

            <option value="openai/gpt-oss-120b:free">GPT OSS 120B (Free)</option>
            <option value="openai/gpt-oss-20b:free">GPT OSS 20B (Free)</option>
            <option value="poolside/laguna-s-2.1:free">Poolside Laguna S 2.1 (Free)</option>
            <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Free)</option>
            <option value="deepseek/deepseek-chat">DeepSeek V3</option>
            <option value="gpt-4o-mini">GPT-4o Mini</option>
            <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
        </select>
    </header>

    <div id="chat"></div>

    <div id="inputArea">

<!-- ================= RIGHT CLICK CONTEXT MENU ================= -->

        <i data-lucide="copy"></i>
    </button>
    <button type="button" class="mobile-action-btn" id="mobileRetryBtn" title="Regenerate" aria-label="Regenerate">
        <i data-lucide="rotate-cw"></i>
    </button>

<script>
/* =========================================================
   ELEMENTS & CORE STATE (HOISTED GLOBALS)
   ========================================================= */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");
const modelSelect = document.getElementById("modelSelect");

const panelToggle = document.getElementById("panelToggle");
const panelClose = document.getElementById("panelClose");
const backdrop = document.getElementById("backdrop");
const sidePanel = document.getElementById("sidePanel");
const appShell = document.getElementById("appShell");
const newChatButton = document.getElementById("newChat");
const chatList = document.getElementById("chatList");
const chatCountBadge = document.getElementById("chatCountBadge");

const msgContextMenu = document.getElementById("msgContextMenu");
const ctxCopyBtn = document.getElementById("ctxCopyBtn");
const ctxRegenerateBtn = document.getElementById("ctxRegenerateBtn");

const mobileMsgActions = document.getElementById("mobileMsgActions");
const mobileCopyBtn = document.getElementById("mobileCopyBtn");
const mobileRetryBtn = document.getElementById("mobileRetryBtn");

// Per-conversation running state registry: { [chatId]: { isGenerating: bool, abortController: AbortController, sleepResolve: fn } }
const activeGenerations = {};

let chatSessions = {};
let currentChatId = null;

const MAX_TOOL_ROUNDS = 50;
const MAX_TOOLS_PER_ROUND = 10;

const BASE_SYSTEM_PROMPT = `
You are a helpful AI assistant with access to local shell task execution and web search.
Use web_search whenever current, recent, or externally verifiable information is needed.
To execute terminal commands, call run_task. You can inspect output, read files, or manage shell scripts.
If a command is long-running, run_task returns an initial state. Use task_stdout to monitor it, task_send_input to pipe interactive text into standard input, and task_kill to terminate it.
Use sleep if you need to pause and let background processes finish compilation, I/O, or network tasks before polling again.
You may call multiple tools in one turn.
Multiple tool calls are executed sequentially.
Your responses may use rich Markdown headings, lists, tables, blockquotes, code fences, and LaTeX.
You can generate flowcharts, sequence diagrams, and architecture maps using \`\`\`mermaid code blocks; they are automatically rendered into interactive visual diagrams.
`.trim();

let activeSystemPrompt = BASE_SYSTEM_PROMPT;
let messages = [{
    role: "system",
    content: activeSystemPrompt
}];

lucide.createIcons();

input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
});

/* =========================================================
   DELEGATED ACCORDION TOGGLE (Works for new & restored messages)
   ========================================================= */
chat.addEventListener("click", (e) => {
    const toggle = e.target.closest(".activity-toggle");
    if (!toggle) return;

    const wrapper = toggle.closest(".activity-wrapper");
    if (!wrapper) return;

    wrapper.classList.toggle("open");
    const parentAi = wrapper.closest(".message.ai");
    if (parentAi) {
        parentAi.dataset.manuallyToggled = "true";
    }
    saveCurrentChatState();
});

/* =========================================================
   PRODUCTION TOUCH GESTURE ENGINE (rAF Buffer + Slop Lock)
   ========================================================= */
let isPanelOpen = false;

// Touch State
let touchStartX = 0;
let touchStartY = 0;
let lastX = 0;
let lastTime = 0;
let velocityX = 0;

// Gesture Flags
let isTracking = false;
let isLocked = false;
let isHorizontal = false;

// Render Coordination via requestAnimationFrame
let pendingX = 0;
let rafId = null;

const SLOP = 12; // 12px deadzone buffer: suppresses taps and separates vertical scroll

function getPanelWidth() {
    return sidePanel.getBoundingClientRect().width || 280;
}

function renderTransform(x, withAnimation = false) {
    const width = getPanelWidth();
    const clampedX = Math.max(0, Math.min(width, x));
    const progress = clampedX / width;

    if (withAnimation) {
        sidePanel.classList.add("animate-transition");
        appShell.classList.add("animate-transition");
        backdrop.classList.add("animate-transition");
    } else {
        sidePanel.classList.remove("animate-transition");
        appShell.classList.remove("animate-transition");
        backdrop.classList.remove("animate-transition");
    }

    sidePanel.style.transform = `translate3d(${clampedX - width}px, 0, 0)`;
    appShell.style.transform = `translate3d(${clampedX}px, 0, 0)`;
    backdrop.style.opacity = progress;
    backdrop.style.pointerEvents = progress > 0.05 ? "auto" : "none";
}

function requestRender(x) {
    pendingX = x;
    if (!rafId) {
        rafId = requestAnimationFrame(() => {
            renderTransform(pendingX, false);
            rafId = null;
        });
    }
}

function openPanel(animated = true) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    isPanelOpen = true;
    renderTransform(getPanelWidth(), animated);
    sidePanel.setAttribute("aria-hidden", "false");
    panelToggle.setAttribute("aria-expanded", "true");
}

function closePanel(animated = true) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    isPanelOpen = false;
    renderTransform(0, animated);
    sidePanel.setAttribute("aria-hidden", "true");
    panelToggle.setAttribute("aria-expanded", "false");
    backdrop.style.pointerEvents = "none";
}

function togglePanel() {
    isPanelOpen ? closePanel(true) : openPanel(true);
}

panelToggle.addEventListener("click", togglePanel);
panelClose.addEventListener("click", () => closePanel(true));
backdrop.addEventListener("click", () => closePanel(true));

window.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;

    const target = e.target;
    if (target.closest('button, a, input, textarea, select, pre, .table-wrapper, table, .mobile-msg-actions, .composer')) {
        return;
    }

    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    lastX = t.clientX;
    lastTime = performance.now();
    velocityX = 0;

    isTracking = true;
    isLocked = false;
    isHorizontal = false;
}, { passive: true });

window.addEventListener("touchmove", (e) => {
    if (!isTracking) return;

    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);

    if (!isLocked) {
        if (absX < SLOP && absY < SLOP) {
            return;
        }
        isLocked = true;
        if (absX > absY * 1.5) {
            isHorizontal = true;
        } else {
            isTracking = false;
            return;
        }
    }

    if (!isHorizontal) return;

    if (e.cancelable) {
        e.preventDefault();
    }

    const now = performance.now();
    const dt = now - lastTime;
    if (dt > 0) {
        const instantV = (t.clientX - lastX) / dt;
        velocityX = 0.6 * instantV + 0.4 * velocityX;
        lastX = t.clientX;
        lastTime = now;
    }

    const width = getPanelWidth();
    const startOffset = isPanelOpen ? width : 0;
    const currentX = Math.max(0, Math.min(width, startOffset + dx));

    requestRender(currentX);
}, { passive: false });

window.addEventListener("touchend", () => {
    if (!isTracking || !isHorizontal) {
        isTracking = false;
        return;
    }
    isTracking = false;

    if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
    }

    const width = getPanelWidth();

    if (velocityX > 0.3) {
        openPanel(true);
    } else if (velocityX < -0.3) {
        closePanel(true);
    } else {
        if (pendingX > width * 0.45) {
            openPanel(true);
        } else {
            closePanel(true);
        }
    }
}, { passive: true });

window.addEventListener("touchcancel", () => {
    if (!isTracking) return;
    isTracking = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    isPanelOpen ? openPanel(true) : closePanel(true);
});

document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && isPanelOpen) {
        closePanel(true);
    }
});

/* =========================================================
   PERSISTENT CONVERSATION ENGINE (localStorage)
   ========================================================= */
const CHATS_STORAGE_KEY = "multisearch_chats_v2";
const ACTIVE_CHAT_KEY = "multisearch_active_id_v2";

function loadStoredChats() {
    try {
        const raw = localStorage.getItem(CHATS_STORAGE_KEY);
        chatSessions = raw ? JSON.parse(raw) : {};
    } catch (e) {
        chatSessions = {};
    }
    currentChatId = localStorage.getItem(ACTIVE_CHAT_KEY);
}

function saveStoredChats() {
    try {
        localStorage.setItem(CHATS_STORAGE_KEY, JSON.stringify(chatSessions));
        if (currentChatId) {
            localStorage.setItem(ACTIVE_CHAT_KEY, currentChatId);
        } else {
            localStorage.removeItem(ACTIVE_CHAT_KEY);
        }
    } catch (e) {
        console.warn("Storage write error:", e);
    }
}

function generateChatId() {
    return "chat_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
}

function formatRelativeTime(ts) {
    if (!ts) return "";
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return "Just now";
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
    return new Date(ts).toLocaleDateString([], { month: "short", day: "numeric" });
}

function createNewChatSession(initialUserText = "") {
    const id = generateChatId();
    const raw = (initialUserText || "").trim();
    const title = raw ? (raw.slice(0, 34) + (raw.length > 34 ? "..." : "")) : "Conversation";

    chatSessions[id] = {
        id,
        title,
        createdAt: Date.now(),
        updatedAt: Date.now(),
        model: modelSelect ? modelSelect.value : "dots-studio/dots-3-note-preview:free",
        messages: [...messages],
        chatHtml: chat.innerHTML
    };
    currentChatId = id;
    saveStoredChats();
    renderChatList();
    return id;
}

function renderMessagesToDOM(msgList) {
    chat.innerHTML = "";
    if (!Array.isArray(msgList)) return;

    msgList.forEach(m => {
        if (!m || m.role === "system") return;

        if (m.role === "user") {
            const userDiv = document.createElement("div");
            userDiv.className = "message user";
            const text = typeof m.content === "string" ? m.content : extractText(m);
            userDiv.textContent = text;
            userDiv.dataset.rawText = text;
            chat.appendChild(userDiv);
        } else if (m.role === "assistant") {
            const aiText = typeof m.content === "string" ? m.content : extractText(m);
            if (!aiText && (!m.tool_calls || m.tool_calls.length === 0)) return;

            const aiDiv = document.createElement("div");
            aiDiv.className = "message ai";
            aiDiv.dataset.rawText = aiText;

            let parsed = "";
            try {
                parsed = marked.parse(aiText);
            } catch (e) {
                parsed = escapeHTML(aiText);
            }
            const sanitized = DOMPurify.sanitize(parsed, {
                ADD_ATTR: ["target", "rel", "class", "data-code", "data-chart", "sandbox", "srcdoc"]
            });

            aiDiv.innerHTML = `
                <div class="pre-search-content"></div>
                <div class="activity-wrapper" style="display: none;"></div>
                <div class="final-content">${sanitized}</div>
            `;
            chat.appendChild(aiDiv);
        }
    });
}

function renderChatList() {
    if (!chatList) return;

    const ids = Object.keys(chatSessions);
    if (chatCountBadge) chatCountBadge.textContent = String(ids.length);

    if (ids.length === 0) {
        chatList.innerHTML = '<div class="history-empty">No conversations yet</div>';
        return;
    }

    ids.sort((a, b) => (chatSessions[b].updatedAt || 0) - (chatSessions[a].updatedAt || 0));

    chatList.innerHTML = "";
    ids.forEach(id => {
        const session = chatSessions[id];
        const isActive = id === currentChatId;
        const isRunning = Boolean(activeGenerations[id]?.isGenerating);

        const item = document.createElement("div");
        item.className = `chat-item ${isActive ? "active" : ""}`;
        item.dataset.chatId = id;
        item.setAttribute("role", "button");
        item.setAttribute("tabindex", "0");

        item.innerHTML = `
            <div class="chat-item-main">
                <span class="chat-item-title">${escapeHTML(session.title || "Untitled Chat")}</span>
                <span class="chat-item-time">${formatRelativeTime(session.updatedAt)}</span>
            </div>
            ${isRunning ? '<div class="chat-item-spinner" title="Task running in background"></div>' : ''}
            <button type="button" class="chat-item-del" title="Delete conversation" aria-label="Delete conversation">
                <i data-lucide="x"></i>
            </button>
        `;

        item.addEventListener("click", (e) => {
            if (e.target.closest(".chat-item-del")) return;
            if (id !== currentChatId) {
                switchToChat(id);
            }
            closePanel(true);
        });

        item.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                if (id !== currentChatId) {
                    switchToChat(id);
                }
                closePanel(true);
            }
        });

        const delBtn = item.querySelector(".chat-item-del");
        if (delBtn) {
            delBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                e.preventDefault();
                deleteChatSession(id);
            });
        }

        chatList.appendChild(item);
    });

    lucide.createIcons({ root: chatList });
}

function switchToChat(id) {
    if (!chatSessions[id]) return;
    if (typeof hideMobileActions === "function") {
        hideMobileActions();
    }

    if (currentChatId && currentChatId !== id && chatSessions[currentChatId]) {
        saveCurrentChatState();
    }

    currentChatId = id;
    const session = chatSessions[id];

    messages = (session.messages && session.messages.length > 0)
        ? JSON.parse(JSON.stringify(session.messages))
        : [{ role: "system", content: activeSystemPrompt }];

    if (messages[0]?.role === "system") {
        messages[0].content = activeSystemPrompt;
    }

    if (session.model && modelSelect) {
        modelSelect.value = session.model;
    }

    chat.innerHTML = session.chatHtml || "";

    chat.querySelectorAll(".message.user").forEach(msg => {
        if (!msg.dataset.rawText) {
            msg.dataset.rawText = msg.textContent.trim();
        }
    });

    bindInteractiveCodeBlocks(chat);
    renderMermaidInElement(chat);
    wrapTablesForScroll(chat);
    lucide.createIcons({ root: chat });

    if (typeof renderMathInElement === "function") {
        renderMathInElement(chat, {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "\\[", right: "\\]", display: true},
                {left: "$", right: "$", display: false},
                {left: "\\(", right: "\\)", display: false}
            ],
            throwOnError: false, strict: false
        });
    }

    const isThisRunning = Boolean(activeGenerations[id]?.isGenerating);
    updateSendButtonState(isThisRunning);

    saveStoredChats();
    renderChatList();
    chat.scrollTop = chat.scrollHeight;
}

function deleteChatSession(id) {
    if (!chatSessions[id]) return;

    if (activeGenerations[id]) {
        stopChatGeneration(id);
    }

    delete chatSessions[id];

    if (currentChatId === id) {
        currentChatId = null;
        const remaining = Object.keys(chatSessions);
        if (remaining.length > 0) {
            remaining.sort((a, b) => (chatSessions[b].updatedAt || 0) - (chatSessions[a].updatedAt || 0));
            switchToChat(remaining[0]);
        } else {
            chat.innerHTML = "";
            messages = [{ role: "system", content: activeSystemPrompt }];
            updateSendButtonState(false);
            saveStoredChats();
            renderChatList();
        }
    } else {
        saveStoredChats();
        renderChatList();
    }
}

function saveCurrentChatState() {
    if (!currentChatId || !chatSessions[currentChatId]) return;

    const session = chatSessions[currentChatId];
    session.chatHtml = chat.innerHTML;
    if (messages && messages.length > 0) {
        session.messages = JSON.parse(JSON.stringify(messages));
    }
    session.updatedAt = Date.now();
    if (modelSelect) session.model = modelSelect.value;

    if (!session.title || session.title === "Conversation") {
        const firstUserMsg = session.messages.find(m => m.role === "user");
        if (firstUserMsg && typeof firstUserMsg.content === "string") {
            const rawTitle = firstUserMsg.content.trim();
            session.title = rawTitle.slice(0, 34) + (rawTitle.length > 34 ? "..." : "");
        }
    }

    saveStoredChats();
    renderChatList();
}

if (modelSelect) {
    modelSelect.addEventListener("change", () => {
        if (currentChatId && chatSessions[currentChatId]) {
            chatSessions[currentChatId].model = modelSelect.value;
            saveStoredChats();
        }
    });
}

function escapeHTML(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

function wrapTablesForScroll(container) {

        wrapper.appendChild(table);
    });
}

function bindInteractiveCodeBlocks(container) {
    container.querySelectorAll(".code-container").forEach(block => {
        if (block.dataset.bound) return;
        block.dataset.bound = "true";

        const bubble = block.querySelector(".code-bubble");
        const rawCode = decodeURIComponent(block.dataset.code || "");
        const diagramBtn = block.querySelector(".code-mode-diagram");
        const playBtn = block.querySelector(".code-mode-play");
        const codeBtn = block.querySelector(".code-mode-code");
        const iframe = block.querySelector(".code-preview-frame");
        const copyBtn = block.querySelector(".code-copy-btn");

        if (diagramBtn && codeBtn && bubble) {
            diagramBtn.addEventListener("click", () => {
                diagramBtn.classList.add("active");
                codeBtn.classList.remove("active");
                bubble.classList.add("view-diagram");
            });

            codeBtn.addEventListener("click", () => {
                codeBtn.classList.add("active");
                diagramBtn.classList.remove("active");
                bubble.classList.remove("view-diagram");
            });
        }

        if (playBtn && codeBtn && iframe && bubble) {
            playBtn.addEventListener("click", () => {
                playBtn.classList.add("active");
                codeBtn.classList.remove("active");
                bubble.classList.add("view-preview");

                if (!iframe.srcdoc) {
                    iframe.srcdoc = rawCode;
                }
            });

            codeBtn.addEventListener("click", () => {
                codeBtn.classList.add("active");
                playBtn.classList.remove("active");
                bubble.classList.remove("view-preview");
            });
        }

        if (copyBtn) {
            copyBtn.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(rawCode);
                    copyBtn.innerHTML = '<i data-lucide="check"></i>';
                    lucide.createIcons({ root: copyBtn });
                    setTimeout(() => {
                        copyBtn.innerHTML = '<i data-lucide="copy"></i>';
                        lucide.createIcons({ root: copyBtn });
                    }, 1500);
                } catch (error) {
                    console.error("Copy failed:", error);
                }
            });
        }
    });
}

let mermaidChartCounter = 0;

async function renderMermaidInElement(container) {
    if (typeof mermaid === "undefined") return;

    const targets = container.querySelectorAll(".mermaid-target");
    for (const target of targets) {
        if (target.dataset.rendered === "true") continue;
        target.dataset.rendered = "true";

        const rawCode = decodeURIComponent(target.dataset.chart || "").trim();
        if (!rawCode) continue;

        const id = "mermaid-svg-" + (++mermaidChartCounter);
        try {
            const { svg } = await mermaid.render(id, rawCode);
            target.innerHTML = svg;
        } catch (err) {
            console.error("Mermaid render error:", err);
            const stray = document.getElementById("d" + id) || document.getElementById(id);
            if (stray) stray.remove();
            target.innerHTML = `<div class="mermaid-error">⚠️ Diagram syntax error: ${escapeHTML(err.message || err)}</div>`;
        }
    }
}

function updateAIStream(element, fullText, isDone, startTime, hasTools) {
    const activityWrapper = element.querySelector(".activity-wrapper");
    const activityLabel = element.querySelector(".activity-label");
    const preSearchContent = element.querySelector(".pre-search-content");
    const finalContent = element.querySelector(".final-content");
    const cursor = element.querySelector(".blinking-cursor");

    const answerText = fullText;
    element.dataset.rawText = answerText;
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

    if (isDone) {
        activityLabel.textContent = `Worked for ${elapsed} seconds`;
        if (activityWrapper.classList.contains("open") && !element.dataset.manuallyToggled) {
            activityWrapper.classList.remove("open");
        }
    } else {
        activityLabel.textContent = `Working... (${elapsed}s)`;
    }

    if (answerText.trim()) {
        let parsed = "";
        try {
            parsed = marked.parse(answerText);
        } catch (e) {
            parsed = escapeHTML(answerText);
        }
        
        const sanitized = DOMPurify.sanitize(parsed, { 
            ADD_ATTR: ["target", "rel", "class", "data-code", "data-chart", "sandbox", "srcdoc"] 
        });

        if (hasTools) {
            finalContent.innerHTML = sanitized;
            wrapTablesForScroll(finalContent);
            lucide.createIcons({ root: finalContent });
        } else {
            preSearchContent.innerHTML = sanitized;
            wrapTablesForScroll(preSearchContent);
            lucide.createIcons({ root: preSearchContent });
        }
    } else if (isDone) {
        if (hasTools) {
            finalContent.innerHTML = "<em>(Command execution completed without trailing commentary)</em>";
        } else {
            finalContent.innerHTML = "<em>(The model returned an empty response)</em>";
        }
    }

    if (isDone) {
        if (cursor) cursor.remove();

        element.querySelectorAll("a").forEach(link => {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
        });

        bindInteractiveCodeBlocks(element);
        renderMermaidInElement(element);

        if (typeof renderMathInElement === "function") {
            renderMathInElement(element, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "\\[", right: "\\]", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\(", right: "\\)", display: false}
                ],
                throwOnError: false, strict: false
            });
        }
    }

    chat.scrollTop = chat.scrollHeight;
}

async function executeTool(name, args, badgeEl, state) {
    if (state.abortRequested) {
        throw new Error("Generation stopped by user");
    }

    if (name === "run_task" && badgeEl) {
        const cooldown = Math.max(1, parseInt(args.timeout, 10) || 1);
        const ringBar = badgeEl.querySelector(".timer-ring-bar");
        if (ringBar) {
            ringBar.style.transition = "none";
            ringBar.style.strokeDashoffset = "108.39";
            void ringBar.getBoundingClientRect();
            ringBar.style.transition = `stroke-dashoffset ${cooldown}s linear`;
            ringBar.style.strokeDashoffset = "0";
        }
    }

    if (name === "sleep") {
        const delay = Math.max(1, parseInt(args.seconds, 10) || 1);
        if (badgeEl) {
            const ringBar = badgeEl.querySelector(".timer-ring-bar");
            const labelEl = badgeEl.querySelector(".search-label");
            const queryEl = badgeEl.querySelector(".search-query");

            if (ringBar) {
                ringBar.style.transition = "none";
                ringBar.style.strokeDashoffset = "108.39";
                void ringBar.getBoundingClientRect();
                ringBar.style.transition = `stroke-dashoffset ${delay}s linear`;
                ringBar.style.strokeDashoffset = "0";
            }
            if (labelEl) labelEl.textContent = "Sleeping...";
            if (queryEl) queryEl.textContent = `${delay}s timer`;
        }

        await new Promise(res => {
            let timeoutId = null;
            const cleanup = () => {
                if (timeoutId) clearTimeout(timeoutId);
                state.sleepResolve = null;
                res();
            };
            state.sleepResolve = cleanup;
            timeoutId = setTimeout(cleanup, delay * 1000);
        });

        if (state.abortRequested) {
            if (badgeEl) {
                const labelEl = badgeEl.querySelector(".search-label");
                if (labelEl) labelEl.textContent = "Stopped";
                badgeEl.classList.add("timer-finished");
            }
            throw new Error("Generation stopped by user");
        }

        if (badgeEl) {
            const labelEl = badgeEl.querySelector(".search-label");
            const queryEl = badgeEl.querySelector(".search-query");
            if (labelEl) labelEl.textContent = "Timer hit";
            if (queryEl) queryEl.textContent = `${delay}s completed`;
            badgeEl.classList.add("timer-finished");
        }

        return { status: "timer_completed", seconds: delay };
    }

    let url = "";
    let method = "POST";

    if (name === "web_search") {
        url = "/api/search";
    } else if (name === "run_task") {
        url = "/api/task/run";
    } else if (name === "task_stdout") {
        url = `/api/task/stdout/${encodeURIComponent(args.task_id)}`;
        method = "GET";
    } else if (name === "task_send_input") {
        url = `/api/task/input/${encodeURIComponent(args.task_id)}`;
    } else if (name === "task_kill") {
        url = `/api/task/kill/${encodeURIComponent(args.task_id)}`;
    } else {
        throw new Error("Unknown tool: " + name);
    }

    const opts = {
        method,
        headers: { "Content-Type": "application/json" }
    };

    if (state.abortController) {
        opts.signal = state.abortController.signal;
    }

    if (method === "POST" && name !== "task_kill") {
        opts.body = JSON.stringify(args);
    }

    let response;
    try {
        response = await fetch(url, opts);
    } catch (e) {
        if (state.abortRequested || e.name === "AbortError") {
            throw new Error("Generation stopped by user");
        }
        throw e;
    }

    let data;
    const text = await response.text();
    try {
        data = JSON.parse(text);
    } catch (e) {
        throw new Error(`API error (${response.status}): ${text.slice(0, 70)}...`);
    }

    if (!response.ok) {
        throw new Error(data.error || "Tool call execution failed");
    }

    if (name === "run_task" && badgeEl) {
        badgeEl.classList.add("timer-finished");
    }

    return data;
}

function formatToolResult(data) {
    if (typeof data === "object") return JSON.stringify(data);
    return String(data);
}

function logEvent(tag, data) {
    try {
        fetch("/api/log", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tag, ...data })
        }).catch(() => {});
    } catch (e) {}
}

function extractText(response) {
    const content = response?.message?.content;
    if (typeof content === "string") return content;
    if (Array.isArray(content)) return content.map(x => x.text || "").join("");
    if (typeof response === "string") return response;
    if (response?.text) return response.text;
    return "";
}

function updateSendButtonState(active) {

        sendButton.classList.add("generating");

        sendButton.setAttribute("aria-label", "Stop generation");
        sendButton.innerHTML = '<i data-lucide="square"></i>';

        sendButton.innerHTML = '<i data-lucide="arrow-up"></i>';

        input.focus();

function stopChatGeneration(chatId) {
    const state = activeGenerations[chatId];
    if (!state || !state.isGenerating) return;

    state.abortRequested = true;
    logEvent("STOP_REQUESTED_BY_USER", { chatId });

    if (state.abortController) {
        try {
            state.abortController.abort();
        } catch (e) {}
    }

    if (typeof state.sleepResolve === "function") {
        state.sleepResolve();
        state.sleepResolve = null;
    }
}

function finalizeStopped(element, startTime, hasTools) {
    logEvent("GENERATION_STOPPED_BY_USER", { elapsed: ((Date.now() - startTime) / 1000).toFixed(1) });
    const cursor = element.querySelector(".blinking-cursor");
    if (cursor) cursor.remove();

    const finalContent = element.querySelector(".final-content");
    const preContent = element.querySelector(".pre-search-content");
    const activityWrapper = element.querySelector(".activity-wrapper");
    const activityLabel = element.querySelector(".activity-label");

    if (activityLabel) {
        activityLabel.textContent = `Stopped after ${((Date.now() - startTime) / 1000).toFixed(1)}s`;
    }
    if (activityWrapper && activityWrapper.classList.contains("open") && !element.dataset.manuallyToggled) {
        activityWrapper.classList.remove("open");
    }

    const targetContent = hasTools ? finalContent : (preContent || finalContent);
    if (targetContent) {
        const text = targetContent.innerHTML.trim();
        if (!text) {
            targetContent.innerHTML = "<em>(Generation stopped)</em>";
        } else {
            targetContent.innerHTML += "<p><em>(Generation stopped)</em></p>";
        }
    }
    element.dataset.rawText = (targetContent?.innerText || targetContent?.textContent || "").trim();
    chat.scrollTop = chat.scrollHeight;
}

/* =========================================================
   ASYNCHRONOUS AGENT RUNNER (Decoupled per Chat Session)
   ========================================================= */
async function runAgent(userText, currentAIMessage, chatId) {
    const state = activeGenerations[chatId];
    if (!state || state.abortRequested) {
        finalizeStopped(currentAIMessage, Date.now(), false);
        return;
    }

    const session = chatSessions[chatId];
    if (!session) return;

    session.messages.push({ role: "user", content: userText });
    const selectedModel = session.model || modelSelect.value;
    const overallStartTime = Date.now();
    let hasRunTools = false;
    let emptyRetryUsed = false;

    logEvent("REQUEST_START", { chatId, model: selectedModel, userText });

    for (let round = 0; round < MAX_TOOL_ROUNDS; round++) {
        if (state.abortRequested) {
            finalizeStopped(currentAIMessage, overallStartTime, hasRunTools);
            return;
        }

        const activityLabel = currentAIMessage.querySelector(".activity-label");
        if (activityLabel) {
            activityLabel.textContent = round === 0 ? "Working..." : `Working... (reasoning round ${round + 1})`;
        }

        let response;
        try {
            if (state.abortRequested) {
                finalizeStopped(currentAIMessage, overallStartTime, hasRunTools);
                return;
            }
            response = await puter.ai.chat(session.messages, { model: selectedModel, tools: tools });
        } catch (err) {
            if (state.abortRequested || err.message === "Generation stopped by user") {
                finalizeStopped(currentAIMessage, overallStartTime, hasRunTools);
                return;
            }
            logEvent("CHAT_CALL_ERROR", { round, model: selectedModel, error: String(err && err.message || err) });
            throw err;
        }

        if (state.abortRequested) {
            finalizeStopped(currentAIMessage, overallStartTime, hasRunTools);
            return;
        }

        const assistantMessage = response?.message;
        if (!assistantMessage) {
            logEvent("NO_ASSISTANT_MESSAGE", { round, model: selectedModel, rawResponsePreview: JSON.stringify(response).slice(0, 300) });
            throw new Error("Puter returned no message");
        }

        session.messages.push(assistantMessage);

        const toolCalls = assistantMessage.tool_calls || [];
        const roundText = extractText(response);

        logEvent("ROUND_COMPLETE", {
            round,
            chatId,
            model: selectedModel,
            roundTextLength: roundText.length,
            toolCallCount: toolCalls.length
        });

        if (toolCalls.length === 0) {
            const finalDisplay = roundText.trim();

            if (!emptyRetryUsed && !hasRunTools && finalDisplay.length === 0) {
                emptyRetryUsed = true;
                logEvent("EMPTY_REPLY_RETRY", { model: selectedModel, userText, round });
                session.messages.push({
                    role: "system",
                    content: "Your previous reply was empty. Provide an immediate direct answer or perform the required tool action."
                });
                continue;
            }

            logEvent("REQUEST_FINAL", {
                chatId,
                model: selectedModel,
                userText,
                hasRunTools,
                finalTextLength: finalDisplay.length,
                elapsedSeconds: ((Date.now() - overallStartTime) / 1000).toFixed(1)
            });
            updateAIStream(currentAIMessage, finalDisplay, true, overallStartTime, hasRunTools);
            return;
        }

        hasRunTools = true;
        const calls = toolCalls.slice(0, MAX_TOOLS_PER_ROUND);

        for (let i = 0; i < calls.length; i++) {
            if (state.abortRequested) {
                finalizeStopped(currentAIMessage, overallStartTime, hasRunTools);
                return;
            }

            const call = calls[i];
            const toolName = call.function?.name;
            let args = {};

            try {
                args = JSON.parse(call.function?.arguments || "{}");
            } catch (err) {
                args = {};
            }

            const badgeEl = addToolBadge(currentAIMessage, toolName, args);

            try {
                const result = await executeTool(toolName, args, badgeEl, state);
                if (state.abortRequested) {
                    finalizeStopped(currentAIMessage, overallStartTime, hasRunTools);
                    return;
                }
                logEvent("TOOL_RESULT", { toolName, args, resultPreview: JSON.stringify(result).slice(0, 500) });
                session.messages.push({
                    role: "tool",
                    tool_call_id: call.id,
                    name: toolName,
                    content: formatToolResult(result)
                });
            } catch (error) {
                if (state.abortRequested || error.message === "Generation stopped by user") {
                    finalizeStopped(currentAIMessage, overallStartTime, hasRunTools);
                    return;
                }
                logEvent("TOOL_ERROR", { toolName, args, error: String(error && error.message || error) });
                session.messages.push({
                    role: "tool",
                    tool_call_id: call.id,
                    name: toolName,
                    content: JSON.stringify({ error: error.message })
                });
            }
        }

        if (state.abortRequested) {
            finalizeStopped(currentAIMessage, overallStartTime, hasRunTools);
            return;
        }

        if (toolCalls.length > MAX_TOOLS_PER_ROUND) {
            session.messages.push({
                role: "tool",
                content: JSON.stringify({ error: `Maximum of ${MAX_TOOLS_PER_ROUND} tool calls per round reached.` })
            });
        }
    }

    if (state.abortRequested) {
        finalizeStopped(currentAIMessage, overallStartTime, hasRunTools);
        return;
    }

    logEvent("MAX_TOOL_ROUNDS_REACHED", { model: selectedModel, userText });
    updateAIStream(currentAIMessage, "*(Max reasoning rounds reached)*", true, overallStartTime, true);
}

/* =========================================================
   SEND LOGIC & DRAWER ACTIONS
   ========================================================= */
if (newChatButton) {
    newChatButton.addEventListener("click", () => {
        if (typeof hideMobileActions === "function") {
            hideMobileActions();
        }
        if (currentChatId && chatSessions[currentChatId]) {
            saveCurrentChatState();
        }
        currentChatId = null;
        localStorage.removeItem(ACTIVE_CHAT_KEY);
        chat.innerHTML = "";
        messages = [{ role: "system", content: activeSystemPrompt }];
        updateSendButtonState(false);
        renderChatList();
        input.value = "";
        input.style.height = "auto";
        input.focus();
        closePanel(true);
    });
}

async function send() {
    if (typeof hideMobileActions === "function") {
        hideMobileActions();
    }

    if (currentChatId && activeGenerations[currentChatId]?.isGenerating) {
        stopChatGeneration(currentChatId);
        return;
    }

    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";

    const userDiv = document.createElement("div");
    userDiv.className = "message user";
    userDiv.textContent = text;
    userDiv.dataset.rawText = text;
    chat.appendChild(userDiv);
    chat.scrollTop = chat.scrollHeight;

    let targetChatId = currentChatId;
    if (!targetChatId || !chatSessions[targetChatId]) {
        targetChatId = createNewChatSession(text);
    } else {
        saveCurrentChatState();
    }

    const targetSession = chatSessions[targetChatId];
    targetSession.chatHtml = chat.innerHTML;

    activeGenerations[targetChatId] = {
        isGenerating: true,
        abortRequested: false,
        abortController: new AbortController(),
        sleepResolve: null
    };

    updateSendButtonState(true);
    renderChatList();

    const currentAIMessage = createAIMessageShell();

    try {
        await runAgent(text, currentAIMessage, targetChatId);
    } catch (error) {
        const state = activeGenerations[targetChatId];
        if (!state?.abortRequested && error.message !== "Generation stopped by user") {
            console.error(error);
            logEvent("SEND_FATAL_ERROR", { userText: text, error: String(error && error.message || error) });
            currentAIMessage.querySelector(".final-content").textContent = "Error: " + error.message;
            const cursor = currentAIMessage.querySelector(".blinking-cursor");
            if (cursor) cursor.remove();
        }
    } finally {
        if (targetSession) {
            targetSession.chatHtml = (currentChatId === targetChatId) ? chat.innerHTML : targetSession.chatHtml;
        }
        delete activeGenerations[targetChatId];

        if (currentChatId === targetChatId) {
            updateSendButtonState(false);
            chat.scrollTop = chat.scrollHeight;
        }

        saveStoredChats();
        renderChatList();
    }
}

sendButton.addEventListener("click", () => {
    send();
});

input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
    }
});

/* =========================================================
   RIGHT-CLICK CONTEXT MENU (COPY & REGENERATE)
   ========================================================= */
let contextMenuTargetEl = null;
let contextMenuTargetText = "";

function hideContextMenu() {
    if (msgContextMenu && msgContextMenu.style.display !== "none") {
        msgContextMenu.style.display = "none";
        contextMenuTargetEl = null;
        contextMenuTargetText = "";
    }
}

async function copyTextToClipboard(text) {
    if (!text && text !== "0") return false;
    let copied = false;

    if (navigator.clipboard && window.isSecureContext) {
        try {
            await navigator.clipboard.writeText(text);
            copied = true;
        } catch (e) {
            console.warn("navigator.clipboard.writeText failed, using fallback:", e);
        }
    }

    if (copied) return true;

    try {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        textarea.style.top = "-9999px";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        copied = document.execCommand("copy");
        document.body.removeChild(textarea);
        return copied;
    } catch (err) {
        console.error("execCommand fallback error:", err);
        return false;
    }
}

function getMessageTextToCopy(msgEl) {
    if (!msgEl) return "";
    if (msgEl.dataset.rawText) {
        return msgEl.dataset.rawText;
    }
    if (msgEl.classList.contains("user")) {
        return msgEl.textContent.trim();
    }

    const finalEl = msgEl.querySelector(".final-content");
    if (finalEl) {
        const clone = finalEl.cloneNode(true);
        clone.querySelectorAll(".code-copy-btn, .code-mode-pill, .code-lang-line").forEach(el => el.remove());
        return (clone.innerText || clone.textContent).trim();
    }
    return msgEl.innerText.trim();
}

if (chat && msgContextMenu) {
    chat.addEventListener("contextmenu", (e) => {
        const msgEl = e.target.closest(".message");
        if (!msgEl) return;

        e.preventDefault();
        contextMenuTargetEl = msgEl;
        contextMenuTargetText = getMessageTextToCopy(msgEl);

        msgContextMenu.style.display = "flex";
        lucide.createIcons({ root: msgContextMenu });

        const isBusy = Boolean(currentChatId && activeGenerations[currentChatId]?.isGenerating);
        if (ctxRegenerateBtn) {
            ctxRegenerateBtn.disabled = isBusy;
        }

        const menuRect = msgContextMenu.getBoundingClientRect();
        const menuWidth = menuRect.width || 140;
        const menuHeight = menuRect.height || 74;

        let posX = e.clientX;
        let posY = e.clientY;

        if (posX + menuWidth > window.innerWidth) {
            posX = window.innerWidth - menuWidth - 8;
        }
        if (posY + menuHeight > window.innerHeight) {
            posY = window.innerHeight - menuHeight - 8;
        }

        msgContextMenu.style.left = `${Math.max(8, posX)}px`;
        msgContextMenu.style.top = `${Math.max(8, posY)}px`;
    });
}

document.addEventListener("pointerdown", (e) => {
    if (msgContextMenu && msgContextMenu.style.display !== "none") {
        if (!msgContextMenu.contains(e.target)) {
            hideContextMenu();
        }
    }
});

chat.addEventListener("scroll", () => {
    hideContextMenu();
    hideMobileActions();
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        hideContextMenu();
        hideMobileActions();
    }
});

if (ctxCopyBtn) {
    ctxCopyBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const textToCopy = contextMenuTargetText || (contextMenuTargetEl ? getMessageTextToCopy(contextMenuTargetEl) : "");
        const success = await copyTextToClipboard(textToCopy);

        ctxCopyBtn.innerHTML = success 
            ? '<i data-lucide="check"></i><span>Copied</span>' 
            : '<i data-lucide="copy"></i><span>Failed</span>';
        lucide.createIcons({ root: ctxCopyBtn });

        setTimeout(() => {
            ctxCopyBtn.innerHTML = '<i data-lucide="copy"></i><span>Copy</span>';
            lucide.createIcons({ root: ctxCopyBtn });
            hideContextMenu();
        }, 500);
    });
}

async function regenerateFromMessage(target) {
    const isBusy = Boolean(currentChatId && activeGenerations[currentChatId]?.isGenerating);
    if (!target || isBusy || !currentChatId) return;

    let userPrompt = "";
    let userEl = null;

    if (target.classList.contains("user")) {
        userEl = target;
        userPrompt = userEl.textContent.trim();
    } else {
        let prev = target.previousElementSibling;
        while (prev && !prev.classList.contains("user")) {
            prev = prev.previousElementSibling;
        }
        if (prev) {
            userEl = prev;
            userPrompt = userEl.textContent.trim();
        }
    }

    if (!userEl || !userPrompt) return;

    const allUserEls = Array.from(chat.querySelectorAll(".message.user"));
    const userIndex = allUserEls.indexOf(userEl);
    if (userIndex === -1) return;

    const session = chatSessions[currentChatId];
    if (!session) return;

    let count = -1;
    let msgIndex = -1;
    for (let i = 0; i < session.messages.length; i++) {
        if (session.messages[i].role === "user") {
            count++;
            if (count === userIndex) {
                msgIndex = i;
                break;
            }
        }
    }

    if (msgIndex !== -1) {
        session.messages = session.messages.slice(0, msgIndex);
    }

    while (userEl.nextElementSibling) {
        userEl.nextElementSibling.remove();
    }

    userEl.remove();

    input.value = userPrompt;
    await send();
}

if (ctxRegenerateBtn) {
    ctxRegenerateBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const isBusy = Boolean(currentChatId && activeGenerations[currentChatId]?.isGenerating);
        if (!contextMenuTargetEl || isBusy) {
            hideContextMenu();
            return;
        }

        const target = contextMenuTargetEl;
        hideContextMenu();
        await regenerateFromMessage(target);
    });
}

/* =========================================================
   MOBILE MESSAGE ACTIONS (POPUP UNDER MESSAGE: COPY & RETRY)
   ========================================================= */
let mobileActionsTargetEl = null;

function isMobileDevice() {
    return window.matchMedia("(max-width: 768px)").matches || 
           (window.matchMedia("(pointer: coarse)").matches && window.innerWidth <= 1024);
}

function hideMobileActions() {
    if (mobileMsgActions && mobileMsgActions.style.display !== "none") {
        mobileMsgActions.style.display = "none";
        mobileActionsTargetEl = null;
    }
}

function showMobileActions(msgEl) {
    if (!msgEl || !mobileMsgActions) return;
    mobileActionsTargetEl = msgEl;

    const isBusy = Boolean(currentChatId && activeGenerations[currentChatId]?.isGenerating);

    if (mobileCopyBtn) {
        mobileCopyBtn.innerHTML = '<i data-lucide="copy"></i>';
    }
    if (mobileRetryBtn) {
        mobileRetryBtn.innerHTML = '<i data-lucide="rotate-cw"></i>';
        mobileRetryBtn.disabled = isBusy;
    }

    mobileMsgActions.style.display = "inline-flex";
    lucide.createIcons({ root: mobileMsgActions });

    const rect = msgEl.getBoundingClientRect();
    const actionsRect = mobileMsgActions.getBoundingClientRect();
    const actionsWidth = actionsRect.width || 76;
    const actionsHeight = actionsRect.height || 36;

    let top = rect.bottom + 6;
    let left = rect.left;

    if (msgEl.classList.contains("user")) {
        left = rect.right - actionsWidth;
    } else {
        left = rect.left + 4;
    }

    const minLeft = 12;
    const maxLeft = window.innerWidth - actionsWidth - 12;
    left = Math.max(minLeft, Math.min(maxLeft, left));

    const composerEl = document.getElementById("inputArea");
    const bottomLimit = composerEl ? composerEl.getBoundingClientRect().top - 8 : window.innerHeight - 70;

    if (top + actionsHeight > bottomLimit) {
        top = Math.max(60, rect.top - actionsHeight - 6);
    }

    mobileMsgActions.style.left = `${left}px`;
    mobileMsgActions.style.top = `${top}px`;
}

if (chat) {
    chat.addEventListener("click", (e) => {
        if (!isMobileDevice()) return;

        if (e.target.closest("button, a, input, textarea, select, .activity-toggle, .code-copy-btn, .code-mode-pill, .table-wrapper")) {
            return;
        }

        const msgEl = e.target.closest(".message");
        if (!msgEl) {
            hideMobileActions();
            return;
        }

        if (mobileActionsTargetEl === msgEl && mobileMsgActions.style.display !== "none") {
            hideMobileActions();
        } else {
            showMobileActions(msgEl);
        }
    });
}

document.addEventListener("pointerdown", (e) => {
    if (mobileMsgActions && mobileMsgActions.style.display !== "none") {
        if (!mobileMsgActions.contains(e.target) && !e.target.closest(".message")) {
            hideMobileActions();
        }
    }
});

if (mobileCopyBtn) {
    mobileCopyBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!mobileActionsTargetEl) return;

        const textToCopy = getMessageTextToCopy(mobileActionsTargetEl);
        const success = await copyTextToClipboard(textToCopy);

        mobileCopyBtn.innerHTML = success 
            ? '<i data-lucide="check"></i>' 
            : '<i data-lucide="x"></i>';
        lucide.createIcons({ root: mobileCopyBtn });

        setTimeout(() => {
            mobileCopyBtn.innerHTML = '<i data-lucide="copy"></i>';
            lucide.createIcons({ root: mobileCopyBtn });
            hideMobileActions();
        }, 500);
    });
}

if (mobileRetryBtn) {
    mobileRetryBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!mobileActionsTargetEl || isGenerating) {
            hideMobileActions();
            return;
        }

        const target = mobileActionsTargetEl;
        hideMobileActions();
        await regenerateFromMessage(target);
    });
}

/* =========================================================
   APPLICATION BOOTSTRAP (SAFE ORDERING)
   ========================================================= */
async function initSystemEnvironment() {
    try {
        const res = await fetch("/api/system-info");
        if (!res.ok) return;
        const info = await res.json();

        let envPrompt = `\n\n[HOST SYSTEM ENVIRONMENT]\n`;
        envPrompt += `- Operating System: ${info.osName} (${info.arch})\n`;
        envPrompt += `- Terminal Shell: ${info.shellName}\n`;
        envPrompt += `- Working Directory: ${info.cwd}\n`;
        if (info.username) envPrompt += `- Current User: ${info.username}\n`;

        if (Array.isArray(info.instructions) && info.instructions.length > 0) {
            envPrompt += `\n[TERMINAL & SHELL INSTRUCTIONS FOR THIS SYSTEM]:\n`;
            info.instructions.forEach(ins => {
                envPrompt += `- ${ins}\n`;
            });
        }

        activeSystemPrompt = BASE_SYSTEM_PROMPT + "\n" + envPrompt;
        if (messages.length > 0 && messages[0].role === "system") {
            messages[0].content = activeSystemPrompt;
        }
        if (currentChatId && chatSessions[currentChatId]) {
            if (chatSessions[currentChatId].messages[0]?.role === "system") {
                chatSessions[currentChatId].messages[0].content = activeSystemPrompt;
            }
        }
    } catch (e) {
        console.warn("Could not fetch system info:", e);
    }
}

function initChatSessions() {
    loadStoredChats();
    let hasCleaned = false;
    for (const id of Object.keys(chatSessions)) {
        const sess = chatSessions[id];
        const hasUserMsg = sess.messages && sess.messages.some(m => m.role === "user");
        if (!hasUserMsg && (!sess.chatHtml || !sess.chatHtml.trim())) {
            delete chatSessions[id];
            hasCleaned = true;
        }
    }
    if (hasCleaned) {
        saveStoredChats();
    }

    const storedIds = Object.keys(chatSessions);
    if (storedIds.length > 0) {
        const targetId = (currentChatId && chatSessions[currentChatId]) ? currentChatId : (
            storedIds.sort((a, b) => (chatSessions[b].updatedAt || 0) - (chatSessions[a].updatedAt || 0)),
            storedIds[0]
        );
        currentChatId = null;
        switchToChat(targetId);
    } else {
        currentChatId = null;
        chat.innerHTML = "";
        messages = [{ role: "system", content: activeSystemPrompt }];
        renderChatList();
    }
}

initSystemEnvironment();
initChatSessions();
