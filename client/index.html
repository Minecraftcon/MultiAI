<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0f0f0f">
    <title>MultiSearch AI</title>

    <!-- Native PWA flags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Puter -->
    <script src="https://js.puter.com/v2/"></script>

    <!-- Vendor libraries served locally (no CDN required) -->

    <!-- UI Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Markdown -->
    <script src="/vendor/marked/marked.min.js"></script>

    <!-- HTML sanitizer -->
    <script src="/vendor/dompurify/purify.min.js"></script>

    <!-- Immediate theme restoration to prevent FOUC -->
    <script>
        (function() {
            try {
                var t = localStorage.getItem("multiai_theme") || "dark";
                document.documentElement.setAttribute("data-theme", t);
                var isLight = (t === "light") || (t === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) {
                    if (isLight) meta.setAttribute("content", "#f8f9fa");
                    else if (t === "midnight") meta.setAttribute("content", "#000000");
                    else meta.setAttribute("content", "#0f0f0f");
                }
            } catch (e) {}
        })();
    </script>

    <!-- Syntax highlighting -->
    <link id="hljsTheme" rel="stylesheet" href="/vendor/highlightjs/github-dark.min.css">
    <script src="/vendor/highlightjs/highlight.min.js"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="/vendor/katex/katex.min.css">
    <script src="/vendor/katex/katex.min.js"></script>
    <script src="/vendor/katex/auto-render.min.js"></script>

    <!-- Lucide Icons -->
    <script src="/vendor/lucide/lucide.min.js"></script>

    <!-- Modular Stylesheets -->
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/panel.css">
    <link rel="stylesheet" href="./styles/chat.css">
    <link rel="stylesheet" href="./styles/activity.css">
    <link rel="stylesheet" href="./styles/plan-hitl.css">
    <link rel="stylesheet" href="./styles/plan-modal.css">
    <link rel="stylesheet" href="./styles/command.css">
    <link rel="stylesheet" href="./styles/code.css">
    <link rel="stylesheet" href="./styles/diff-viewer.css">
    <link rel="stylesheet" href="./styles/composer.css">
    <link rel="stylesheet" href="./styles/bottom-sheet.css">
    <link rel="stylesheet" href="./styles/error-recovery.css">
    <link rel="stylesheet" href="./styles/start-page.css">
    <link rel="stylesheet" href="./styles/question-prompt.css">
    <link rel="stylesheet" href="./styles/plan-dock.css">
    <link rel="stylesheet" href="./styles/context-menu.css">
    <link rel="stylesheet" href="./styles/settings.css">
    <link rel="stylesheet" href="./styles/onboarding.css">
    <link rel="stylesheet" href="./styles/responsive.css">
</head>
<body>

<div id="backdrop"></div>

<!-- ================= SIDE PANEL ================= -->
<aside id="sidePanel" class="side-panel" aria-hidden="true">
    <!-- Panel Header: MultiAI Title & Collapse Button (Always pinned and accessible) -->
    <div class="panel-header">
        <div class="panel-brand">
            <span class="panel-brand-title">MultiAI</span>
        </div>
        <button id="panelClose" class="icon-btn panel-close-btn" type="button" aria-label="Close panel" title="Close panel">
            <i data-lucide="panel-left-close"></i>
        </button>
    </div>

    <!-- Search View Mode Bar (Revealed smoothly when in search mode) -->
    <div id="panelSearchBar" class="panel-search-bar" aria-hidden="true">
        <div class="panel-search-pill">
            <i data-lucide="search" class="search-pill-icon"></i>
            <input type="text" id="panelSearchInput" class="panel-search-pill-input" placeholder="Search chats…" autocomplete="off" spellcheck="false" aria-label="Search chats">
        </div>
        <button id="panelSearchClose" class="panel-search-close-btn" type="button" aria-label="Exit search" title="Close search">
            <i data-lucide="x"></i>
        </button>
    </div>

    <!-- Normal Panel View: Navigation & Modes (Collapses when search is active) -->
    <div id="panelNormalView" class="panel-normal-view">

        <!-- Mode Switcher Pill (Chat / Build) -->
        <div class="panel-mode-wrap">
            <div class="mode-pill" role="tablist" aria-label="Mode selector">
                <div class="mode-pill-thumb" aria-hidden="true"></div>
                <button type="button" id="modeChatBtn" class="mode-pill-item active" role="tab" aria-selected="true" data-mode="chat" tabindex="0">
                    <i data-lucide="message-square"></i>
                    <span>Chat</span>
                </button>
                <button type="button" id="modeBuildBtn" class="mode-pill-item" role="tab" aria-selected="false" data-mode="build" tabindex="-1">
                    <i data-lucide="hammer"></i>
                    <span>Build</span>
                </button>
            </div>
        </div>

        <!-- Chat Navigation Actions -->
        <div id="panelChatNav" class="panel-nav">
            <button id="newChat" class="panel-nav-btn" type="button" title="Start a new chat">
                <i data-lucide="square-pen"></i>
                <span>New Chat</span>
            </button>
            <button id="newVoiceBtn" class="panel-nav-btn" type="button" title="Start voice conversation">
                <i data-lucide="audio-lines"></i>
                <span>New Voice Chat</span>
            </button>
            <button id="newImageBtn" class="panel-nav-btn" type="button" title="Generate an image">
                <i data-lucide="image"></i>
                <span>New Image</span>
            </button>
        </div>

        <!-- Build Navigation Actions (Visible in Build Mode) -->
        <div id="panelBuildNav" class="panel-nav" style="display: none;">
            <button id="addProjectBtn" class="panel-nav-btn" type="button" title="Choose a project directory">
                <i data-lucide="folder-plus"></i>
                <span>Add Project</span>
            </button>
        </div>
    </div>

    <!-- Chats & Projects Section -->
    <div class="panel-body">
        <div id="panelSectionHeader" class="panel-section-header">
            <span id="panelSectionLabel" class="panel-section-label">Chats</span>
            <div class="panel-section-actions">
                <button id="panelAddProjectHeaderBtn" class="panel-sub-btn" type="button" title="Add Project" aria-label="Add project directory" style="display: none;">
                    <i data-lucide="folder-plus"></i>
                </button>
                <button id="panelSearchToggle" class="panel-sub-btn" type="button" title="Search chats" aria-label="Search chats">
                    <i data-lucide="search"></i>
                </button>
            </div>
        </div>

        <div id="chatList" class="chat-list">
            <div class="history-empty">No conversations yet</div>
        </div>

        <div id="projectList" class="project-list" style="display: none;"></div>
    </div>

    <!-- Footer: Settings & More with Dark Gradient Fade -->
    <div class="panel-footer">
        <button id="panelSettingsBtn" class="panel-footer-btn" type="button" aria-label="Settings and more">
            <div class="panel-footer-left">
                <i data-lucide="settings"></i>
                <span>Settings & More</span>
            </div>
        </button>
    </div>
</aside>

<!-- ================= SLIDING APP SHELL ================= -->
<div id="appShell">
    <header>
        <div class="header-left">
            <button id="panelToggle" class="icon-btn" type="button" aria-label="Open panel" aria-expanded="false" title="Open panel">
                <i data-lucide="panel-left"></i>
            </button>
        </div>

        <div class="header-center">
            <div id="modelPicker" class="model-picker">
                <button id="modelPickerBtn" class="model-picker-btn" type="button" aria-haspopup="dialog" aria-expanded="false" title="Select AI Model">
                    <span id="modelPickerName" class="model-picker-name">Gemini 2.5 Flash</span>
                    <i data-lucide="chevron-down" class="model-picker-chevron"></i>
                </button>
                <select id="modelSelect" class="sr-only-select" title="Select AI Model" tabindex="-1" aria-hidden="true">
                    <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (Fast & Capable)</option>
                    <option value="dots-studio/dots-3-note-preview:free">dots-3-note-preview (Free)</option>
                </select>
            </div>
        </div>

        <div class="header-right">
            <button id="headerNewChatBtn" class="icon-btn" type="button" aria-label="New chat" title="New chat">
                <i data-lucide="square-pen"></i>
            </button>
        </div>
    </header>

    <main id="chat">
        <div id="chatBottomSentinel" class="chat-bottom-sentinel" aria-hidden="true"></div>
    </main>

    <!-- Floating Scroll-To-Bottom Button (Grok-style affordance) -->
    <button id="scrollToBottomBtn" class="chat-scroll-btn" type="button" aria-label="Scroll to bottom" title="Scroll to bottom">
        <i data-lucide="chevron-down"></i>
    </button>

    <!-- Start Page Celestial / Aurora Backdrop (Active on welcome screen) -->
    <div id="startPageBackdrop" class="start-page-backdrop" aria-hidden="true"></div>

    <div id="inputArea"></div>

    <!-- ================= SETTINGS SCREEN CONTAINER ================= -->
    <div id="settingsContainer"></div>
</div>

<!-- ================= ATTACHMENT BOTTOM SHEET DRAWER ================= -->
<div id="attachBackdrop" class="attach-backdrop" style="display: none;"></div>
<div id="attachSheet" class="attach-sheet" aria-hidden="true">
    <div class="sheet-handle-bar">
        <div class="sheet-drag-handle"></div>
    </div>
    <div class="sheet-header">
        <span>Add to conversation</span>
        <button id="attachSheetClose" type="button" class="icon-btn" aria-label="Close sheet">
            <i data-lucide="x"></i>
        </button>
    </div>
    <div class="sheet-actions-grid">
        <button id="pickImageBtn" type="button" class="sheet-action-card">
            <div class="sheet-action-icon image-icon-bg">
                <i data-lucide="image"></i>
            </div>
            <div class="sheet-action-text">
                <span class="sheet-action-title">Image</span>
                <span class="sheet-action-desc">Upload photos & screenshots</span>
            </div>
        </button>
        <button id="pickDocBtn" type="button" class="sheet-action-card">
            <div class="sheet-action-icon doc-icon-bg">
                <i data-lucide="file-text"></i>
            </div>
            <div class="sheet-action-text">
                <span class="sheet-action-title">Documents</span>
                <span class="sheet-action-desc">PDF, TXT, code & data</span>
            </div>
        </button>
    </div>
    <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
    <input type="file" id="docInput" accept=".pdf,.txt,.md,.json,.csv,.py,.js,.html,.css,.yaml,.yml,.xml,.sh,.ts,.jsx,.tsx,.sql,.c,.cpp,.h,.doc,.docx" multiple style="display: none;">
</div>

<!-- ================= RIGHT CLICK CONTEXT MENU (MESSAGE / IN-CHAT) ================= -->
<div id="msgContextMenu" class="context-menu" style="display: none;">
    <button type="button" class="context-menu-item" id="ctxEditBtn">
        <i data-lucide="pencil"></i>
        <span>Edit message</span>
    </button>
    <button type="button" class="context-menu-item" id="ctxCopyBtn">
        <i data-lucide="copy"></i>
        <span>Copy</span>
    </button>
    <button type="button" class="context-menu-item" id="ctxRegenerateBtn">
        <i data-lucide="rotate-cw"></i>
        <span>Regenerate</span>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item" id="ctxBranchBtn">
        <i data-lucide="git-branch"></i>
        <span>Branch from here</span>
    </button>
    <button type="button" class="context-menu-item" id="ctxExportBtn">
        <i data-lucide="download"></i>
        <span>Export chat</span>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item danger" id="ctxDeleteBtn">
        <i data-lucide="trash-2"></i>
        <span>Delete</span>
    </button>
</div>

<!-- ================= RIGHT CLICK CONTEXT MENU (SIDEBAR CHAT ITEM) ================= -->
<div id="chatItemContextMenu" class="context-menu" style="display: none;">
    <button type="button" class="context-menu-item" id="chatCtxBranchBtn">
        <i data-lucide="git-branch"></i>
        <span>Branch</span>
    </button>
    <button type="button" class="context-menu-item" id="chatCtxExportBtn">
        <i data-lucide="download"></i>
        <span>Export</span>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item danger" id="chatCtxDeleteBtn">
        <i data-lucide="trash-2"></i>
        <span>Delete</span>
    </button>
</div>

<!-- ================= MOBILE MESSAGE ACTIONS (EDIT, COPY & RETRY) ================= -->
<div id="mobileMsgActions" class="mobile-msg-actions" style="display: none;">
    <button type="button" class="mobile-action-btn" id="mobileEditBtn" title="Edit message" aria-label="Edit message">
        <i data-lucide="pencil"></i>
    </button>
    <button type="button" class="mobile-action-btn" id="mobileCopyBtn" title="Copy" aria-label="Copy">
        <i data-lucide="copy"></i>
    </button>
    <button type="button" class="mobile-action-btn" id="mobileRetryBtn" title="Regenerate" aria-label="Regenerate">
        <i data-lucide="rotate-cw"></i>
    </button>
</div>

<!-- ================= ERROR RECOVERY POPUP (SLIDE FROM RIGHT ON FAILED REQUEST) ================= -->
<div id="errorRecoveryPopup" class="error-recovery-popup" aria-live="polite">
    <div class="recovery-popup-header">
        <div class="recovery-popup-title-group">
            <i data-lucide="alert-circle" class="recovery-alert-icon"></i>
            <span class="recovery-popup-title">Request could not be succeeded</span>
        </div>
        <button id="errorRecoveryClose" type="button" class="recovery-close-btn" aria-label="Dismiss notification">
            <i data-lucide="x"></i>
        </button>
    </div>
    <div id="errorRecoveryMsg" class="recovery-popup-body">
        Continue from here with another model?
    </div>
    <div class="recovery-popup-actions">
        <button id="errorRecoveryCancel" type="button" class="recovery-btn recovery-btn-cancel">
            Cancel
        </button>
        <button id="errorRecoveryContinue" type="button" class="recovery-btn recovery-btn-continue">
            Continue
        </button>
    </div>
</div>
<!-- ================= CHAT ITEM CONTEXT MENU (POPUP FOR ...) ================= -->
<div id="chatItemMenu" class="context-menu chat-item-popover" style="display: none;">
    <button type="button" class="context-menu-item" id="chatRenameBtn">
        <i data-lucide="pencil"></i>
        <span>Rename</span>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item danger" id="chatDeleteBtn">
        <i data-lucide="trash-2"></i>
        <span>Delete</span>
    </button>
</div>

<!-- ================= PROJECT ITEM CONTEXT MENU ================= -->
<div id="projectItemMenu" class="context-menu chat-item-popover" style="display: none;">
    <button type="button" class="context-menu-item" id="projectCopyPathBtn">
        <i data-lucide="copy"></i>
        <span>Copy Path</span>
    </button>
    <button type="button" class="context-menu-item" id="projectNewChatMenuBtn">
        <i data-lucide="plus"></i>
        <span>New Chat</span>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item danger" id="projectRemoveBtn">
        <i data-lucide="trash-2"></i>
        <span>Remove Project</span>
    </button>
</div>

<!-- ================= ADD PROJECT DIRECTORY MODAL ================= -->
<div id="projectModalBackdrop" class="project-modal-backdrop" style="display: none;"></div>
<div id="projectModal" class="project-modal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle" style="display: none;">
    <div class="project-modal-header">
        <div class="project-modal-title-group">
            <i data-lucide="folder-plus"></i>
            <h2 id="projectModalTitle" class="project-modal-title">Open Project Directory</h2>
        </div>
        <button id="projectModalCloseBtn" class="project-modal-close" type="button" aria-label="Close dialog">
            <i data-lucide="x"></i>
        </button>
    </div>
    <div class="project-modal-body">
        <label class="project-input-label" for="projectPathInput">Directory Path</label>
        <div class="project-input-wrap">
            <i data-lucide="folder" class="project-input-icon"></i>
            <input type="text" id="projectPathInput" class="project-input" placeholder="/home/username/projects/my-app" autocomplete="off" spellcheck="false">
        </div>
        <div id="projectPathStatus" class="project-path-status"></div>

        <div class="project-suggestions-label">Quick Suggestions</div>
        <div id="projectSuggestionsList" class="project-suggestions-list">
            <!-- populated dynamically from /api/fs/validate-dir suggestions -->
        </div>

        <label class="project-input-label" for="projectNameInput">Project Name (Optional)</label>
        <div class="project-input-wrap">
            <i data-lucide="tag" class="project-input-icon"></i>
            <input type="text" id="projectNameInput" class="project-input" placeholder="e.g. My Website" autocomplete="off" spellcheck="false">
        </div>
    </div>
    <div class="project-modal-footer">
        <button id="projectModalCancelBtn" type="button" class="project-btn-secondary">Cancel</button>
        <button id="projectModalConfirmBtn" type="button" class="project-btn-primary" disabled>Add Project</button>
    </div>
</div>



<!-- ================= MODEL PICKER MODAL / DROPDOWN ================= -->
<div id="modelPickerBackdrop" class="model-picker-backdrop"></div>
<div id="modelPickerDropdown" class="model-picker-dropdown" role="dialog" aria-label="Select AI Model">
    <div class="model-picker-header">
        <div class="model-picker-search">
            <i data-lucide="search" class="model-search-icon"></i>
            <input type="text" id="modelSearchInput" class="model-search-input" placeholder="Search models…" autocomplete="off" spellcheck="false" aria-label="Search models">
            <button id="modelSearchClear" class="model-search-clear" type="button" aria-label="Clear search" style="display: none;">
                <i data-lucide="x"></i>
            </button>
        </div>
    </div>
    <div id="modelPickerList" class="model-picker-list" role="listbox"></div>
</div>

<!-- Isolated Icon Initializer (Protects against any downstream script failures) -->
<script>
    (function() {
        function renderEarly() {
            if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
                try { lucide.createIcons(); } catch(e) {}
            }
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", renderEarly);
        } else {
            renderEarly();
        }
    })();
</script>
<script type="module" src="./src/utils/icons.js"></script>

<!-- Modular Application Entry Point -->
<script type="module" src="./src/main.js"></script>
</body>
</html>
