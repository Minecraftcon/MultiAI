# ==============================================================================
# MultiAI Model & Provider Configuration (models.yaml)
# ==============================================================================
# This file defines the LLM providers and model presets available in MultiAI.
# Location precedence:
#   1. ~/.MultiAI/models.yaml (user configuration directory, if present)
#   2. ./models.yaml (repository workspace root fallback)
#
# Commands:
#   multiai models  - Open this configuration in your terminal editor ($EDITOR or nano)
#   multiai conf    - Open system presets and server configuration (config.ini)
#
# Key Concepts & Guidelines:
# ------------------------------------------------------------------------------
# 1. API Keys & Security:
#    - API keys are NEVER hardcoded in this file.
#    - Specify 'api_key_env' with the name of your environment variable (e.g. GEMINI_API_KEY).
#    - Export keys in your shell (~/.bashrc, ~/.zshrc) or in a local .env file.
#    - The server resolves keys securely in backend memory; keys are NEVER sent to the browser.
#
# 2. Default Model Selection:
#    - Set 'default: true' on exactly ONE model preset to be the default on initial load.
#    - Alternatively, set 'DefaultStartupLLM = <model-id>' in config.ini.
#
# 3. Model Capabilities:
#    - 'supports_tools: true': Enables autonomous function calling (shell tasks, web search,
#                              file editing, and MCP tool execution). Set to false for chat-only models.
#    - 'supports_vision: true': Enables image & screenshot input for multimodal reasoning.
#    - 'max_context_tokens: <N>': Custom context window ceiling. If omitted, MultiAI applies
#                                 provider/model architecture defaults (e.g. 1M for Gemini, 128k for Llama).
#
# 4. Provider Types:
#    - 'gemini': Google Generative Language API (v1beta).
#    - 'zai': Z.AI GLM models via PaaS v4 API.
#    - 'openai_compatible': Any OpenAI-compliant endpoint (Groq, OpenRouter, SambaNova, etc.).
#    - 'cohere': Cohere v2 chat API.
#    - 'puter': Puter.js serverless proxy (free, no API key needed).
#    - 'local': Local models (Ollama, Kobold.cpp, LM Studio, vLLM) on localhost.
#    - 'tokenharbor': Token Harbor community gateway.
#    - 'omniroute': Local OmniRoute multi-model gateway.
#    - 'opencode': OpenCode Zen free tier endpoints.
# ==============================================================================

