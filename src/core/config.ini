# MultiAI Configuration File (config.ini)

[General]
DefaultStartupLLM = gemini-2.5-flash
DefaultImageProvider = pollinations
DefaultImageModel = flux
DefaultImageAspectRatio = 1:1
RecordDate = true
RecordChatHistory = true
MaxChatHistory = 100
StorageDir = ~/.MultiAI
Port = 8080
Host = 0.0.0.0
LogLevel = info
LogFile = ./logs.txt

[Agent]
MaxToolRounds = 0
MaxToolsPerRound = 10
AutoScroll = true
StreamReasoning = true
TurnTimeoutSeconds = 120

[Tools]
EnableTerminal = true
EnableWebSearch = true
EnableImageGeneration = true
EnableFileOperations = true
DefaultTaskCooldown = 2
MaxFileSizeKB = 1024

[Search]
MaxSearchResults = 5
SearchTimeoutSeconds = 15

[UI]
Theme = dark
AuroraTheme = nebula
ShowLineNumbers = true
CompactMobileView = true
# =========================================================
### Mobile
# =========================================================
[Mobile]
LimitVisibleTurns = true
VisibleTurns = 15
