# ==============================================================================
# MultiAI Master Configuration (config.ini)
# ==============================================================================
# This is the primary system configuration file for MultiAI.
# Location precedence:
#   1. $MULTIAI_CONFIG_PATH (if set in environment)
#   2. ~/.MultiAI/config.ini (user configuration directory)
#   3. ./config.ini (repository root override)
#
# Commands:
#   multiai conf    - Open this configuration in your terminal editor ($EDITOR or nano)
#   multiai models  - Open models and provider setup (models.yaml)
# ==============================================================================

# ==============================================================================
# [General] Core System & Server Presets
# ==============================================================================
[General]
# Default LLM model loaded upon initial page load or when launching a new chat session.
# Must match an 'id' defined under 'models' in models.yaml (e.g. gemini-2.5-flash, glm-4.5-flash).
DefaultStartupLLM = gemini-2.5-flash

# Default provider for image generation tool requests ('pollinations', etc.).
DefaultImageProvider = pollinations

# Default image model to synthesize artwork ('flux', 'turbo', 'flux-realism', etc.).
DefaultImageModel = flux

# Default aspect ratio for synthesized images ('1:1', '16:9', '9:16', '4:3', '3:2').
DefaultImageAspectRatio = 1:1

# Prepend current date and time to the initial system context for time-aware reasoning.
RecordDate = true

# Persist conversation turns to localStorage and storage directory for session resumption.
RecordChatHistory = true

# Maximum number of past conversation turns stored in chat history.
MaxChatHistory = 100

# Canonical root directory for MultiAI logs, scratchpads, and persistent artifacts.
# Supports '~' expansion (e.g. ~/.MultiAI).
StorageDir = ~/.MultiAI

# Network port for the MultiAI Web Server UI & API.
# Can be overridden via CLI: 'multiai --port 8080'.
Port = 8080

# Network host binding address:
# - '0.0.0.0' binds to all network interfaces (accessible across local Wi-Fi / LAN).
# - '127.0.0.1' binds only to localhost (accessible only on this machine).
Host = 0.0.0.0

# Server logging verbosity level ('debug', 'info', 'warn', 'error').
LogLevel = info

# Filepath for server execution log output.
LogFile = ./logs.txt

# System Persona Preset controlling the assistant's tone, instructions, and behavior:
# - 'default': Balanced, helpful, versatile technical AI assistant.
# - 'developer': Elite senior software architect; writes clean, modular, production code.
# - 'creative': Imaginative writer & thought partner with evocative language.
# - 'concise': Ultra-concise, direct, no-fluff answers with essential code and facts only.
# - 'custom': Custom user-defined prompt (configured via Web UI Settings).
SystemPreset = default

# ==============================================================================
# [Agent] Autonomous Agent Execution & Task Server Engine
# ==============================================================================
[Agent]
# Maximum autonomous tool execution rounds per turn before asking the user to continue.
# Set to 0 for unlimited autonomous agent execution loop until goal completion.
MaxToolRounds = 0

# Maximum number of tool calls permitted within a single model response turn.
MaxToolsPerRound = 10

# Automatically scroll the chat window smoothly as new tokens and tool outputs arrive.
AutoScroll = true

# Stream intermediate reasoning tokens (thinking blocks) in real-time when supported.
StreamReasoning = false

# Maximum seconds to wait for an LLM response or task step before timing out.
TurnTimeoutSeconds = 120

# Default model sampling temperature (0.0 = deterministic/focused, 1.0 = creative).
Temperature = 0.7

# Task Server Daemon Engine:
# - 'go': High-performance native static binary (microsecond latency, zero runtime deps).
#         Automatically selects static binary for x86_64, arm64, armv7l, or windows.
# - 'python': Python Flask HTTP WSGI task server (runs on any Python 3 environment).
# Note: TaskDaemon and TaskServer are interchangeable aliases.
TaskServer = python
TaskDaemon = python

# ==============================================================================
# [Tools] Security Boundaries & Tool Execution Toggles
# ==============================================================================
[Tools]
# Allow the agent to execute shell commands via 'run_task'.
EnableTerminal = true

# Allow the agent to perform live DuckDuckGo web searches and web page fetches.
EnableWebSearch = true

# Allow the agent to synthesize artwork and images via 'generate_image'.
EnableImageGeneration = true

# Allow the agent to list, read, and manipulate workspace files via 'list_dir' & 'read_file'.
EnableFileOperations = true

# Allow Model Context Protocol (MCP) server integrations and tool calls.
EnableMcp = true

# Minimum cooldown delay (in seconds) enforced between consecutive task executions.
DefaultTaskCooldown = 2

# Maximum allowed file size (in kilobytes) when reading text files into LLM context.
MaxFileSizeKB = 1024

# ==============================================================================
# [Search] Web Search Provider & Retrieval Settings
# ==============================================================================
[Search]
# Maximum number of search results returned per search query.
MaxSearchResults = 5

# Network timeout (in seconds) for external search API and page fetch requests.
SearchTimeoutSeconds = 15

# ==============================================================================
# [UI] Visual Appearance & Presentation Themes
# ==============================================================================
[UI]
# Base interface theme ('dark' or 'light').
Theme = dark

# Aurora ambient backdrop color theme ('saturn', 'clouds', 'midnight', 'cyberpunk').
AuroraTheme = saturn

# Display line numbers in code blocks and editor snippets.
ShowLineNumbers = true

# Automatically optimize layout for compact mobile and touch screen viewports.
CompactMobileView = true

# ==============================================================================
# [Mobile] Mobile & Touch Device Viewport Tuning
# ==============================================================================
[Mobile]
# Limit rendered conversation turns on mobile browsers to reduce memory consumption.
LimitVisibleTurns = true

# Number of recent conversation turns displayed simultaneously on mobile devices.
VisibleTurns = 15
